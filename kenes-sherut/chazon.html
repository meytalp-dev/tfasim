<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>לוח החזון שלי · כנס בני ובנות השירות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;600;800;900&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE8DF; --panel:#FBF8F1; --ink:#2b2722; --mute:#7a6f60; --line:#E3D9C6; --acc:#C8453A; --acc-ink:#fff; --gold:#A57A2E; --blue:#2F6FB5;
  --fd:"Frank Ruhl Libre",serif; --fb:"Heebo",sans-serif; --r:16px;
}
body[data-t="b"]{ --bg:#14122B; --panel:#1F1C42; --ink:#F3EEFF; --mute:#A9A3CC; --line:#35306A; --acc:#FFB86B; --acc-ink:#1A1733; --fd:"Rubik",sans-serif; --fb:"Rubik",sans-serif; --r:22px; }
body[data-t="c"]{ --bg:#EEF0F2; --panel:#FFFFFF; --ink:#111111; --mute:#5E6670; --line:#111111; --acc:#2F5BFF; --acc-ink:#fff; --fd:"Heebo",sans-serif; --fb:"Heebo",sans-serif; --r:6px; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ראש */
.top{background:#fff;border-bottom:1px solid #e6e6e6}
.top-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:38px;width:auto;display:block}
.steps{display:flex;gap:6px;align-items:center;font-size:.8rem;color:#56606b}
.steps span{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:#f2f3f5;white-space:nowrap}
.steps span b{font-weight:700}
.steps span.on{background:#1d1d1d;color:#fff}
.steps span.ok{background:#e4f3ea;color:#1f6b43}

main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:22px 18px 28px}
h1{font-family:var(--fd);font-weight:800;font-size:clamp(1.7rem,4.4vw,2.6rem);line-height:1.15;margin:0 0 6px}
body[data-t="c"] h1{font-weight:900;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 22px;max-width:60ch}

/* כרטיס פרטים */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;max-width:560px}
body[data-t="c"] .card{border-width:2px;box-shadow:6px 6px 0 #111}
label.l{display:block;font-weight:700;margin:16px 0 6px}
label.l:first-child{margin-top:0}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:transparent;font-size:1rem}
body[data-t="b"] .inp{background:#18163a}
body[data-t="b"] select.inp option{background:#18163a}
.inp:focus{outline:2px solid var(--acc);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.err{color:#C0392B;font-size:.88rem;min-height:1.2em;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:13px 24px;background:var(--acc);color:var(--acc-ink);font-weight:700;cursor:pointer;font-size:1rem;text-decoration:none}
body[data-t="c"] .btn{border-radius:6px;border:2px solid #111;box-shadow:3px 3px 0 #111}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
body[data-t="c"] .btn.ghost{border:2px solid #111}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* מסך בנייה */
.build{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.boardwrap{position:relative}
.board{position:relative;width:100%;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 18px 40px -22px rgba(0,0,0,.45)}
body[data-t="c"] .board{border:2px solid #111;box-shadow:8px 8px 0 #111}
.board canvas.bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.it{position:absolute;touch-action:none;cursor:grab}
.it canvas{display:block;width:100%;height:100%;pointer-events:none}
.it.sel{outline:2px dashed var(--acc);outline-offset:4px;z-index:9999 !important}
.h{position:absolute;width:34px;height:34px;border-radius:50%;background:#fff;color:#111;border:1.5px solid #111;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}
.h svg{width:18px;height:18px}
.it.sel .h{display:flex}
.h-del{top:-20px;right:-20px}
.h-rot{bottom:-20px;left:-20px;cursor:nwse-resize}
.boardnote{color:var(--mute);font-size:.86rem;margin-top:10px;display:flex;gap:6px;align-items:center}

.side{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
body[data-t="c"] .side{border-width:2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-bottom:1px solid var(--line)}
.tab{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:.86rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tab.done .dot{background:#2E9E5B}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.drawer-h{padding:12px 14px 0;font-family:var(--fd);font-weight:800;font-size:1.15rem}
.drawer-q{padding:2px 14px 0;color:var(--mute);font-size:.86rem}
.drawer{padding:12px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.tile{position:relative;border:1px solid var(--line);border-radius:12px;background:transparent;cursor:grab;padding:0;overflow:hidden;text-align:center;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.drawer{grid-auto-rows:max-content;min-height:0;flex:1 1 auto}
.tile svg.art{display:block;width:100%;height:auto;flex:none}
.tile.scene{display:flex;flex-direction:column}
.tile.scene .cap{color:var(--ink);font-size:.8rem;line-height:1.3;padding:6px 8px 8px}
.tile .cap{display:block;font-size:.78rem;padding:4px 6px;color:var(--mute)}
.tile.txt{padding:12px 10px;min-height:84px;display:flex;align-items:center;justify-content:center;font-size:.88rem;line-height:1.35}
.tile.val{min-height:56px;font-family:var(--fd);font-weight:800;font-size:1.05rem}
.tile.wide{grid-column:1/-1}
.tile.add{border-style:dashed;color:var(--acc);font-weight:700;gap:6px;flex-direction:column}
.tile .q-by{display:block;font-size:.72rem;color:var(--mute);margin-top:4px}
.tile:active{transform:scale(.98)}
.ghost-drag{position:fixed;z-index:10000;pointer-events:none;width:110px;opacity:.9;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:0 14px 30px rgba(0,0,0,.3);border-radius:12px;background:var(--panel)}
.side-foot{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
.side-foot .btn{flex:1}

/* שיתוף */
.share-top{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.share-board{max-width:620px;margin:0 auto}
.stk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stk{border:1.5px solid var(--line);border-radius:14px;padding:10px;background:transparent;cursor:pointer;font-weight:700;font-size:.92rem}
.stk[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* סיום */
.final{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.final img{width:100%;border-radius:var(--r);display:block;box-shadow:0 18px 40px -22px rgba(0,0,0,.45)}
.acts{display:flex;flex-direction:column;gap:10px}
.acts .btn{justify-content:flex-start}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:99px;font-size:.92rem;z-index:20000;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* חלונית */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15000;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--panel);color:var(--ink);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-family:var(--fd);margin:0 0 4px;font-size:1.35rem}
.sheet textarea.inp{min-height:96px;resize:vertical}

footer{text-align:center;padding:18px;color:var(--mute);font-size:.82rem}
footer .credit{font-size:.72rem;color:#8A97A6;margin-top:4px}
footer a{color:inherit}
.help{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:.82rem;text-decoration:none;margin-bottom:8px}
.help svg{width:16px;height:16px}

#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body>*:not(#printArea){display:none !important}
  #printArea{display:block}
  #printArea img{width:100%;height:auto;max-height:277mm;object-fit:contain}
  body{background:#fff}
}

@media(max-width:900px){
  .build{grid-template-columns:1fr;gap:12px}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;border-radius:20px 20px 0 0;max-height:none;z-index:500;box-shadow:0 -10px 30px rgba(0,0,0,.18);border-bottom:0}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .drawer-h{display:none}
  .drawer-q{padding-top:8px}
  .drawer{display:flex;overflow-x:auto;overflow-y:hidden;padding:10px 12px;gap:8px;scrollbar-width:none}
  .drawer::-webkit-scrollbar{display:none}
  .tile{flex:0 0 108px;touch-action:pan-x}
  .tile.txt{flex-basis:150px;min-height:96px;font-size:.82rem}
  .tile.val{flex-basis:auto;padding:0 16px;min-height:96px;white-space:nowrap}
  .tile.wide{flex-basis:200px}
  .tile.scene{flex-basis:118px}
  .tile.scene .cap{font-size:.72rem;padding:4px 6px 6px}
  .side-foot{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .side-foot .btn{padding:10px 16px}
  main.building{padding-bottom:300px}
  main.building .board{width:min(100%,calc((100dvh - 380px)*0.8));margin:0 auto}
  main.building .boardnote{display:none}
  .final{grid-template-columns:1fr}
  .steps span:not(.on){display:none}
  .top img{height:30px}
  main{padding:16px 14px 24px}
}
</style>
</head>

var BOARD_H = 1.25; // גובה ביחס לרוחב

  boardEl.appendChild(el); placeEl(it,el);

    if(e.target.closest('.h-del')){ e.stopPropagation(); removeItem(it.id); return; }

    el.setPointerCapture(e.pointerId);

      var a0=Math.atan2(e.clientY-cy,e.clientX-cx), d0=Math.hypot(e.clientX-cx,e.clientY-cy), r0=it.r||0, w0=it.w;
      move=function(ev){ var a=Math.atan2(ev.clientY-cy,ev.clientX-cx), d=Math.hypot(ev.clientX-cx,ev.clientY-cy);
        it.r=r0+(a-a0); it.w=Math.max(0.14,Math.min(0.95,w0*d/d0)); placeEl(it,el); };
    } else {
      var sx=e.clientX, sy=e.clientY, x0=it.x, y0=it.y;

function nextZ(){ return S.items.reduce(function(m,i){ return Math.max(m,i.z||1); },1)+1; }

var DEF_W={art:0.34,object:0.38,photo:0.36,value:0.34,future:0.42,moment:0.4,text:0.42,quote:0.5,song:0.46,sticker:0.36};
// מקום פנוי: נבחר מבין נקודות אקראיות זו שהכי רחוקה מהפריטים הקיימים
function freeSpot(){
  var best=null, bestD=-1;
  for(var k=0;k<60;k++){
    var cx=0.2+Math.random()*0.6, cy=0.36+Math.random()*0.76, d=9;
    S.items.forEach(function(i){ var dd=Math.hypot((i.x-cx)*1.1,(i.y-cy)); if(dd<d) d=dd; });

function addItem(data,x,y){

function useTile(j,x,y){

function bindDrawer(d){
  d.querySelectorAll('.tile').forEach(function(t){
    t.addEventListener('pointerdown',function(e){
      var j=JSON.parse(t.getAttribute('data-j')); if(j.img||j.scene!=null) j.w=0.32;
      var sx=e.clientX, sy=e.clientY, ghost=null, mobile=window.matchMedia('(max-width:900px)').matches, decided=false, dragging=false;
      function mv(ev){

        if(dragging){ ev.preventDefault(); ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px'; }

        if(dragging){ var r=boardEl.getBoundingClientRect();

        } else if(!decided){ useTile(j); if(window.matchMedia('(max-width:900px)').matches) toast('נוסף ללוח'); }
        cleanup();
      }

      t.addEventListener('pointermove',mv); t.addEventListener('pointerup',upf); t.addEventListener('pointercancel',cleanup);
    });
    t.addEventListener('click',function(e){ e.preventDefault(); });
  });
  // מניעת גלילה בזמן גרירה במגע
  d.addEventListener('touchmove',function(e){ if(document.querySelector('.ghost-drag')) e.preventDefault(); },{passive:false});
}

  if(kind==='photo'){ var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=function(){ var f=inp.files[0]; if(!f) return; var fr=new FileReader(); fr.onload=function(){ var im=new Image(); im.onload=function(){
      var mx=900, sc=Math.min(1,mx/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); addItem({type:'photo',cat:'mine',src:c.toDataURL('image/jpeg',0.82),ar:c.height/c.width},x,y); }; im.src=fr.result; }; fr.readAsDataURL(f); };
    inp.click(); return; }
  var T2={future:['איך תיראה השנה כשהיא נגמרת?','בסוף השנה אני רוצה...',60],moment:['רגע טוב שהיה לי','מה קרה?',70],value:['ערך שמוביל אותי','למשל: נדיבות',18],quote:['משפט או אמונה','המשפט',110],text:['מילים משלי','מה תרצו לכתוב?',80]}[kind];
  var big=T2[2]>40;
  sheet('<h2>'+T2[0]+'</h2>'+(big?'<textarea class="inp" id="sT" maxlength="'+T2[2]+'" placeholder="'+T2[1]+'"></textarea>':'<input class="inp" id="sT" maxlength="'+T2[2]+'" placeholder="'+T2[1]+'">')+
    (kind==='quote'?'<label class="l" for="sB">של מי? (לא חובה)</label><input class="inp" id="sB" maxlength="30">':'')+sheetBtns(),function(sh){
    $('sNo').onclick=closeSheet;
    $('sOk').onclick=function(){ var v=$('sT').value.trim(); if(!v){ $('sT').focus(); return; } closeSheet();
      var d={type:kind,cat:kind==='text'?'mine':kind,text:v}; if(kind==='quote') d.by=$('sB').value.trim(); addItem(d,x,y); };
  });
}
function openSong(s,x,y){
  sheet('<h2>השיר שלי</h2>'+
    (s?'<p class="sub" style="margin:0 0 6px"><b>'+esc(s[0])+'</b> · '+esc(s[1])+'</p>':'<label class="l" for="sN">שם השיר</label><input class="inp" id="sN" maxlength="40"><label class="l" for="sA">מבצע/ת</label><input class="inp" id="sA" maxlength="30">')+
    '<label class="l" for="sY">קישור לשיר ביוטיוב</label><input class="inp" id="sY" dir="ltr" inputmode="url" placeholder="https://youtu.be/..." maxlength="200">'+
    '<div class="row" style="margin-top:8px"><a class="btn ghost" id="sFind" target="_blank" rel="noopener" style="padding:8px 14px;font-size:.9rem">'+icon('music')+'חיפוש ביוטיוב</a><span style="color:var(--mute);font-size:.82rem">מוצאים, מעתיקים את הקישור ומדביקים כאן. מכל השירים נבנה פלייליסט.</span></div>'+
    '<div class="err" id="sYe"></div>'+
    '<label class="l" for="sL">שורה מהשיר שמדברת אליכם (לא חובה)</label><input class="inp" id="sL" maxlength="70">'+sheetBtns(),function(){
    function q(){ return s? s[0]+' '+s[1] : (($('sN').value||'')+' '+($('sA').value||'')).trim(); }
    function upd(){ $('sFind').href='https://www.youtube.com/results?search_query='+encodeURIComponent(q()||'שיר'); }
    upd(); if(!s){ $('sN').oninput=upd; $('sA').oninput=upd; }
    $('sNo').onclick=closeSheet;
    $('sOk').onclick=function(){ var n=s?s[0]:$('sN').value.trim(), a=s?s[1]:$('sA').value.trim(); if(!n){ $('sN').focus(); return; }
      var link=$('sY').value.trim(), id=ytId(link);
      if(link && !id){ $('sYe').textContent='זה לא נראה כמו קישור ליוטיוב. העתיקו את הקישור משורת הכתובת או מכפתור "שיתוף".'; return; }
      closeSheet();
      addItem({type:'song',cat:'song',text:n,by:a,line:$('sL').value.trim(),yt:id,link:id?'https://youtu.be/'+id:''},x,y); };
  });
}

/* ---------- שלב 3: שיתוף בקבוצה ---------- */
/* ---------- חיבור לשרת (כשיש כתובת ב-config.js או ?api=) ---------- */
function getJSON(q){ return fetch(API+(API.indexOf('?')<0?'?':'&')+q,{credentials:'omit'}).then(function(r){return r.json();}); }
function postJSON(o){ return fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(function(r){return r.json();}); }
function mySchool(){ return S.profile.school==='other'? S.profile.other : S.profile.school; }
function joinServer(){ if(!API) return Promise.resolve(); return postJSON({a:'join',pid:PID,name:S.profile.name,role:S.profile.role,school:mySchool()}).catch(function(){}); }
var lastSave=0;
// מחכים שכל התמונות בלוח ייטענו (עד 4 שניות) לפני שמצלמים אותו לשרת
function imagesReady(){
  var ims=[]; S.items.forEach(function(it){
    if(it.type==='art') ims.push(artImg(it.kind));
    if(it.img||it.scene!=null) ims.push(picImg(it.img||('sc'+it.scene)));
    if(it.yt) ims.push(ytImg(it.yt));
    if(it.type==='photo') ims.push(photoImg(it));
  });
  return Promise.race([
    Promise.all(ims.map(function(im){ return im.complete? 0 : new Promise(function(res){ im.addEventListener('load',res); im.addEventListener('error',res); }); })),
    new Promise(function(res){ setTimeout(res,4000); })
  ]);
}
function saveBoard(){
  if(!API) return Promise.resolve();
  return ready.then(imagesReady).then(function(){
    var big=exportPNG(), c=document.createElement('canvas'); c.width=480; c.height=600; c.getContext('2d').drawImage(big,0,0,480,600);
    var img=c.toDataURL('image/jpeg',0.72);
    var values=S.items.filter(function(i){return i.type==='value';}).map(function(i){return i.text;});
    var songs=S.items.filter(function(i){return i.type==='song';}).map(function(i){return {title:i.text,by:i.by||'',yt:i.yt||'',line:i.line||''};});
    return joinServer().then(function(){ return postJSON({a:'board',pid:PID,values:values,songs:songs,img:img}); }).then(function(r){ lastSave=Date.now(); return r; });
  }).catch(function(){ toast('השמירה בשרת לא הצליחה. הלוח שמור בטלפון.'); });
}
var stkTimer=null;
function pollStickers(){
  clearTimeout(stkTimer); if(!API||S.step!==3) return;
  getJSON('mode=stickers&pid='+PID).then(function(r){
    if(r&&r.ok){ var have={}; S.items.forEach(function(i){ if(i.sid) have[i.sid]=1; });
      r.stickers.forEach(function(s){ if(!have[s.id]){ addItem({type:'sticker',cat:'sticker',text:s.text,by:s.by,sid:s.id,w:0.3,r:(Math.random()-.5)*0.4}); select(null); toast('קיבלת מדבקה מ'+(s.by||'חברה')); } }); }
  }).catch(function(){}).then(function(){ stkTimer=setTimeout(pollStickers,6000); });
}
function giveSticker(){
  var people=[], to=null, chosen=null;
  sheet('<h2>מדבקת מחמאה לחברה</h2><p class="sub" style="margin:0 0 8px">למי?</p><div class="chips" id="pp"><span style="color:var(--mute)">טוען...</span></div>'+
    '<p class="sub" style="margin:14px 0 0">מה ראיתם בלוח שלה, או בה?</p><div class="stk-grid" id="sg">'+STICKERS.map(function(s){return '<button class="stk" aria-pressed="false">'+esc(s)+'</button>';}).join('')+'</div>'+sheetBtns('שליחה'),function(){
    getJSON('mode=people&school='+encodeURIComponent(mySchool())).then(function(r){
      people=(r.people||[]).filter(function(p){return p.pid!==PID;});
      $('pp').innerHTML=people.length? people.map(function(p,i){return '<button class="chip" data-i="'+i+'" aria-pressed="false">'+esc(p.name)+'</button>';}).join('') : '<span style="color:var(--mute)">עוד אין חברות מהקבוצה שלך. נסו שוב בעוד רגע.</span>';
    }).catch(function(){ $('pp').textContent='אין חיבור כרגע.'; });
    $('pp').onclick=function(e){ var b=e.target.closest('.chip'); if(!b) return; to=people[+b.getAttribute('data-i')]; this.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x===b);}); };
    $('sg').onclick=function(e){ var b=e.target.closest('.stk'); if(!b) return; chosen=b.textContent; this.querySelectorAll('.stk').forEach(function(x){x.setAttribute('aria-pressed',x===b);}); };
    $('sNo').onclick=closeSheet;
    $('sOk').onclick=function(){ if(!to){ toast('בחרו למי'); return; } if(!chosen){ toast('בחרו מדבקה'); return; }
      var btn=this; btn.disabled=true;
      joinServer().then(function(){ return postJSON({a:'sticker',pid:PID,to:to.pid,by:S.profile.name.trim().split(/\s+/)[0],text:chosen}); }).then(function(r){
        btn.disabled=false; if(r&&r.ok){ closeSheet(); toast('המדבקה נשלחה ל'+to.name); } else toast('לא נשלח. נסו שוב.'); }).catch(function(){ btn.disabled=false; toast('אין חיבור. נסו שוב.'); });
    };
  });
}

function step3(m){
  readOnlyExceptStickers=true;
  m.innerHTML='<div class="share-top"><div><h1>משתפים בקבוצה</h1><p class="sub" style="margin:0">כל אחת בתורה מציגה את הלוח ומספרת על פריט אחד שבחרה. אחרי שהיא מספרת, הקבוצה '+(API?'שולחת לה מדבקת מחמאה מהטלפון, והמדבקות מופיעות על הלוח שלה.':'מוסיפה לה מדבקת מחמאה.')+'</p></div>'+
    '<div class="row"><button class="btn" id="addStk">'+icon('star')+(API?'מדבקה לחברה':'מדבקת מחמאה')+'</button><button class="btn ghost" id="back2">'+icon('back')+'חזרה לעריכה</button></div></div>'+
    '<div class="share-board" id="bw"></div><div class="row" style="justify-content:center;margin-top:20px"><button class="btn" id="toSave">לשמירת הלוח '+icon('next')+'</button></div>';
  mountBoard($('bw'));
  $('back2').onclick=function(){ clearTimeout(stkTimer); setStep(2); };
  $('toSave').onclick=function(){ clearTimeout(stkTimer); select(null); setStep(4); };
  if(API){ saveBoard(); pollStickers(); $('addStk').onclick=giveSticker; return; }
  $('addStk').onclick=function(){
    var chosen=null;
    sheet('<h2>מדבקת מחמאה</h2><p class="sub" style="margin:0">מה ראיתם בלוח, או בה?</p><div class="stk-grid" id="sg">'+STICKERS.map(function(s){return '<button class="stk" aria-pressed="false">'+esc(s)+'</button>';}).join('')+'</div>'+
      '<label class="l" for="sBy">ממי? (לא חובה)</label><input class="inp" id="sBy" maxlength="20">'+sheetBtns('הדבקה'),function(){
      $('sg').onclick=function(e){ var b=e.target.closest('.stk'); if(!b) return; chosen=b.textContent; this.querySelectorAll('.stk').forEach(function(x){x.setAttribute('aria-pressed',x===b);}); };
      $('sNo').onclick=closeSheet;
      $('sOk').onclick=function(){ if(!chosen){ toast('בחרו מדבקה'); return; } closeSheet();
        addItem({type:'sticker',cat:'sticker',text:chosen,by:$('sBy').value.trim(),w:0.32,r:(Math.random()-.5)*0.4}); };
    });
  };
}

/* ---------- שלב 4: שמירה ---------- */
function exportPNG(){
  var W=1500, H=Math.round(W*BOARD_H), c=document.createElement('canvas'); c.width=W; c.height=H;
  var x=c.getContext('2d'); drawBoardBg(x,W,H);
  S.items.slice().sort(function(a,b){return (a.z||1)-(b.z||1);}).forEach(function(it){
    var w=it.w*W, h=drawItem(null,it,w); x.save(); x.translate(it.x*W,it.y*W); x.rotate(it.r||0); x.translate(-w/2,-h/2); drawItem(x,it,w); x.restore(); });
  return c;
}
function fname(){ return 'לוח-החזון-'+((S.profile.name||'שלי').trim().replace(/\s+/g,'-'))+'.png'; }
function step4(m){
  m.innerHTML='<h1>שומרים את הלוח</h1><p class="sub">הלוח נשמר גם בדפדפן הזה. אפשר לחזור ולערוך אותו.</p>'+
    '<div class="final"><div><img id="fin" alt="לוח החזון"></div><div class="acts">'+
    '<button class="btn" id="aDl">'+icon('down')+'הורדה כתמונה</button>'+
    (navigator.share?'<button class="btn ghost" id="aSh">'+icon('share')+'שליחה מהטלפון</button>':'')+
    '<button class="btn ghost" id="aCp">'+icon('copy')+'העתקת התמונה</button>'+
    '<button class="btn ghost" id="aPr">'+icon('print')+'הדפסה (A4)</button>'+
    '<button class="btn ghost" id="aBk">'+icon('back')+'חזרה לעריכה</button>'+
    '<a class="btn ghost" href="melave.html'+(qs.get('api')?'?api='+encodeURIComponent(qs.get('api')):'')+'">'+icon('next')+'לדף המלווה של הכנס</a></div></div>';
  ready.then(function(){ setTimeout(function(){
    var c=exportPNG(); $('fin').src=c.toDataURL('image/png'); saveBoard();
    function blob(){ return new Promise(function(res){ c.toBlob(res,'image/png'); }); }
    $('aDl').onclick=function(){ blob().then(function(b){ var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fname(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},4000); }); };
    if($('aSh')) $('aSh').onclick=function(){ blob().then(function(b){ var f=new File([b],fname(),{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f],title:'לוח החזון שלי'}).catch(function(){}); else toast('בטלפון הזה אפשר להוריד את התמונה'); }); };
    $('aCp').onclick=function(){
      if(!navigator.clipboard||!window.ClipboardItem){ toast('ההעתקה לא נתמכת כאן. אפשר להוריד.'); return; }
      navigator.clipboard.write([new ClipboardItem({'image/png':blob()})]).then(function(){toast('התמונה הועתקה');},function(){toast('ההעתקה לא הצליחה. אפשר להוריד.');}); };
    $('aPr').onclick=function(){ $('printArea').innerHTML='<img src="'+$('fin').src+'" alt="">'; var im=$('printArea').querySelector('img'); if(im.complete) window.print(); else im.onload=function(){ window.print(); }; };
  },80); });
  $('aBk').onclick=function(){ setStep(2); };
}

/* ---------- טעינה ---------- */
var ready = Promise.all([
  '900 40px "Frank Ruhl Libre"','700 40px "Frank Ruhl Libre"','500 40px "Frank Ruhl Libre"','700 40px "Assistant"','600 40px "Assistant"','800 40px "Assistant"','400 40px "Assistant"',
  '800 40px "Rubik"','700 40px "Rubik"','500 40px "Rubik"','400 40px "Rubik"','900 40px "Heebo"','800 40px "Heebo"','600 40px "Heebo"','400 40px "Heebo"','500 40px "Heebo"','700 40px "Heebo"','700 40px "Amatic SC"'
].map(function(f){ return document.fonts? document.fonts.load(f,'אבג abc').catch(function(){}) : Promise.resolve(); })).then(function(){ redrawAll(); });
ART.forEach(function(a){ artImg(a[0]); });
window.addEventListener('resize',redrawAll);
render();
ready.then(function(){ setTimeout(redrawAll,50); });
})();

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>עיצובי הדפוס · כנס בתי הספר המקצועיים 23.11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f3ec;--card:#fffdf8;--navy:#0f2f52;--navy2:#2b5a7a;--teal:#3a8f86;--amber:#c8955a;--amber2:#e2b886;--ink:#1d2b3a;--muted:#5d6b78;--line:#e6dccb}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;font-size:16px;line-height:1.6}
a{color:inherit}
.top{background:#fff;border-bottom:1px solid var(--line);text-align:center;padding:18px 16px 10px}
.top img{height:58px}
header.hero{max-width:1080px;margin:0 auto;padding:34px 16px 10px;text-align:center}
.kick{display:inline-flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.14em;color:var(--amber);font-weight:700}
.kick::before,.kick::after{content:"";width:34px;height:1px;background:var(--amber)}
h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:clamp(32px,6vw,56px);line-height:1.05;color:var(--navy);margin-top:10px}
h1 em{font-style:normal;color:var(--teal)}
.lede{max-width:640px;margin:14px auto 0;color:var(--muted);font-size:17px}
nav.chips{position:sticky;top:0;z-index:5;background:rgba(247,243,236,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin-top:22px}
nav.chips .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
nav.chips a{text-decoration:none;font-size:14px;font-weight:500;padding:5px 13px;border-radius:30px;background:#fff;border:1px solid var(--line);color:var(--navy)}
nav.chips a:hover{border-color:var(--amber)}
main{max-width:1080px;margin:0 auto;padding:10px 16px 40px}
section.grp{margin-top:38px}
section.grp>h2{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:28px;color:var(--navy);display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--navy);padding-bottom:6px}
section.grp>h2 small{font-family:'Heebo';font-size:13px;font-weight:500;color:var(--amber);letter-spacing:.1em}
.item{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start;padding:26px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.wide{grid-template-columns:1fr}
.thumb{display:block;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;box-shadow:0 10px 24px -18px rgba(15,47,82,.45);cursor:zoom-in}
.thumb img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain}
.item.wide .thumb img{max-height:440px}
.meta .no{font-family:'Frank Ruhl Libre',serif;font-size:15px;color:var(--amber);font-weight:700}
.meta h3{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:26px;color:var(--navy);line-height:1.15;margin-top:2px}
.spec{margin-top:6px;color:var(--navy2);font-size:15px;font-weight:500}
.desc{margin-top:8px;color:var(--ink)}
.note{margin-top:10px;font-size:14px;background:#fbf1e3;border-right:3px solid var(--amber);padding:8px 12px;border-radius:4px}
.files{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.file .fn{font-size:14px;color:var(--muted);min-width:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-family:'Heebo';font-size:15px;font-weight:700;padding:9px 16px;border-radius:30px;border:0;cursor:pointer;line-height:1.2}
.btn svg{width:17px;height:17px;flex:0 0 auto}
.btn.dl{background:var(--navy);color:#fff}
.btn.dl.sm{font-size:14px;padding:7px 13px;font-weight:500}
.btn.ml{background:#fff;color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
.btn:hover{filter:brightness(1.08)}
/* סטטוס לכל פריט: מוכן לשליחה / עדיין צריך דיוק. הסימון רק בקישור של מיטל (?m=) */
.stat{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:0}
.stat:empty{display:none}
.sb{display:inline-flex;align-items:center;gap:6px;font-family:'Heebo';font-size:14px;font-weight:700;padding:6px 13px;border-radius:30px;line-height:1.2;border:1.5px solid var(--line);background:#fff;color:var(--muted)}
.sb svg{width:16px;height:16px;flex:0 0 auto}
button.sb{cursor:pointer;min-height:40px}
button.sb:disabled{opacity:.55;cursor:wait}
.sb.ready.on{background:#e3f3ef;border-color:var(--teal);color:#1f6b63}
.sb.fix.on{background:#fbf1e3;border-color:var(--amber);color:#8a5a22}
.sn{flex:1 0 100%;font-size:14.5px;background:#fff;border:1px solid var(--line);border-right:3px solid var(--navy2);padding:8px 12px;border-radius:4px;overflow-wrap:anywhere}
.sn-ed{flex:1 0 100%;display:flex;flex-direction:column;gap:8px}
.sn-ed textarea{width:100%;font-family:'Heebo';font-size:16px;line-height:1.5;padding:10px 12px;border:1.5px solid var(--navy2);border-radius:8px;background:#fff;color:var(--ink);resize:vertical}
.sn-act{display:flex;flex-wrap:wrap;gap:8px}.sn-act .btn{min-height:40px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:26px 16px 34px;border-top:1px solid var(--line);margin-top:20px}
.toast{position:fixed;left:50%;bottom:22px;translate:-50% 0;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center;z-index:20}
.toast.on{opacity:1}
.lb{position:fixed;inset:0;background:rgba(15,25,40,.86);display:none;align-items:center;justify-content:center;z-index:30;padding:16px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;background:#fff;border-radius:4px}
@media (max-width:760px){
  .item{grid-template-columns:1fr;gap:14px}
  .thumb img{max-height:420px}
  .meta h3{font-size:23px}
}
</style>
</head>
<body>
<div class="top"><img src="logo.png" alt="משרד העבודה · מינהל הכשרה מקצועית"></div>
<header class="hero">
  <div class="kick">כנס בתי הספר המקצועיים · 23.11.26</div>
  <h1>עיצובי <em>הדפוס</em> לכנס</h1>
  <p class="lede">כל הפריטים במקום אחד. לכל פריט אפשר להוריד את קובץ הדפוס (PDF עם בליד וסימני חיתוך) או לשלוח אותו במייל, למשל לבית הדפוס.</p>
</header>
<nav class="chips"><div class="in" id="nav"></div></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"><img alt=""></div>
<div id="clip" contenteditable="true" style="position:fixed;left:-9999px;top:0;opacity:0"></div>

<script>
const GROUPS=[
 {id:'tagim',t:'תגים ומדבקות',items:[
  {t:'תג שם',spec:'9.5×14.5 ס״מ · בליד 3 מ״מ · דו־צדדי',d:'מקדימה: שם, תפקיד ומקום למדבקת הכוח המנהיגותי. מאחור: "נפגשים בשולחנות העגולים" עם מספר השולחן, "בשעה 11:45 | השולחן שלך", והברקוד האישי. התגים האישיים, עם השמות והברקודים, נשלחים בנפרד. כאן תגים ריקים לרזרבה.',img:'tag.jpg',files:[['תג ריק (פנים + גב)','tag-reik.pdf']]},
  {t:'מדבקות הכוחות',spec:'דף A4 לכל כוח · 12 מדבקות 7×4 ס״מ',d:'בכל דף כל המדבקות עם אותה מילה, דף לכל אחד מעשרת הכוחות. בסוף 3 דפים של מדבקות ריקות לכתיבה בטוש.',img:'stickers.jpg',files:[['דפי A4 · 12 מדבקות בדף','stickers.pdf'],['מדבקות בגודל אמיתי · 10 כוחות','stickers-godel-amiti.pdf'],['מדבקה ריקה בגודל אמיתי','stickers-reika.pdf']]}
 ]},
 {id:'kapot',t:'קאפות',items:[
  {t:'קאפת הכוחות',spec:'70×100 ס״מ · בליד 5 מ״מ',d:'"מהו הכוח המנהיגותי שלך?" עם הסבר על עשרת הכוחות, ובסוף המשפט המודגש "כי בעידן שבו הטכנולוגיה מתקדמת, הכוח האמיתי שלנו נשאר אנושי".',img:'kapa-kochot.jpg',files:[['קאפת הכוחות','kapa-kochot.pdf']]},
  {t:'קאפות הרשתות',spec:'70×100 ס״מ · בליד 5 מ״מ · קאפה לכל רשת',d:'הלוגו של הרשת בעיגול, ומתחתיו רשימת בתי הספר של הרשת.',img:'kapot.jpg',wide:true,
   note:'סכנין: ממתין ללוגו של הרשת. דרור: טיוטה. הלוגו מהאתר ברזולוציה נמוכה, וצריך קובץ איכותי מהרשת.',
   files:[['אורט','kapa-ort.pdf'],['עמל','kapa-amal.pdf'],['עתיד','kapa-atid.pdf'],['דרור','kapa-dror.pdf'],['סכנין (טיוטה)','kapa-sakhnin.pdf']]}
 ]},
 {id:'rollups',t:'רולאפים',items:[
  {t:'רולאפ ברוכים הבאים',spec:'85×200 ס״מ · בליד 5 מ״מ · 10 ס״מ תחתונים נכנסים למעמד',d:'ברוכים הבאים, "מובילים את החינוך המקצועי במדינת ישראל", נושא הכנס והאיור של ההזמנה.',img:'rollup-bruchim.jpg',files:[['ברוכים הבאים','rollup-bruchim.pdf']]},
  {t:'רולאפ החזון',spec:'85×200 ס״מ · בליד 5 מ״מ · 10 ס״מ תחתונים נכנסים למעמד',d:'החינוך המקצועי: לומדים, יוצרים, מתנסים, מצליחים. בשלושת העיגולים: ידע מקצועי והתנסות, מיומנויות וכישורים רלוונטיים, חוויות הצלחה ויחס אישי.',img:'rollup-chazon.jpg',files:[['החזון','rollup-chazon.pdf']]},
  {t:'חמשת עקרונות החינוך היוצר',spec:'5 רולאפים · 85×200 ס״מ · בליד 5 מ״מ',d:'רולאפ לכל עיקרון, לשימוש גם אחרי הכנס. כשהם עומדים בשורה, 01 מימין עד 05 משמאל, הגלים ממשיכים מרולאפ לרולאפ.',img:'rollup-ekronot.jpg',wide:true,
   files:[['01 · האדם והחברה במרכז','rollup-ekron-1.pdf'],['02 · למידה דואלית ופיתוח מיומנויות','rollup-ekron-2.pdf'],['03 · רלוונטיות לכל אדם','rollup-ekron-3.pdf'],['04 · פתיחת אפשרויות ואופקים','rollup-ekron-4.pdf'],['05 · מודל חי ודינמי','rollup-ekron-5.pdf']]}
 ]},
 {id:'shulchanot',t:'לשולחנות העגולים',items:[
  {t:'דף הנחיות למנחי השולחנות',spec:'A4 · 3 עמודים',d:'מהלך הפעילות בשלושה שלבים, נציג.ת השולחן שרושם.ת בדף המלווה, ודגם מלא של מה שממלאים. החוברות האישיות לכל שולחן, עם רשימת המשתתפים, נשלחות בנפרד.',img:'manchim.jpg',files:[['דף המנחים','manchim-klali.pdf']]},
  {t:'כרטיסיות שיח',spec:'שאלות עיבוד: 10×15 ס״מ · חד־צדדי · שאלות דיון: A5',d:'שש שאלות העיבוד של השלב הראשון, בלי מספרים, כל אחת פעמיים. הדפסה חד־צדדית, בלי גב. שאלות הדיון (מסתכלים קדימה · 2030, מתחילים מחר בבוקר, והמוטו) בדף A5 גדול.',img:'kartisiyot.jpg',wide:true,files:[['שאלות עיבוד · 10×15','kartisiyot.pdf'],['שאלות דיון · A5','kartisiyot-a5.pdf']]},
  {t:'פתקים למטריות',spec:'5 נוסחים · 10×6 ס״מ · חור למעלה',d:'החור באמצע הצד העליון. על הפתק עצמו אין סימון של החור.',img:'petakim.jpg',files:[['פתקים למטריות','petakim-mitriyot.pdf']]},
  {t:'מספרי שולחן · אוהל מתקפל',spec:'A4 לאורך · 20 שולחנות + 2 ריקים · מקפלים באמצע',d:'דף לכל שולחן. מקפלים בקו המקווקו ומעמידים על השולחן. בשני הצדדים מספר השולחן ושם המנחה, כך שרואים מכל כיוון. בסוף הקובץ שני אוהלים ריקים. הדפסה חד־צדדית.',img:'shulchan-ohel.jpg',files:[['20 מספרי השולחן + 2 ריקים','shulchan-ohel.pdf']]}
 ]},
 {id:'mitzagim',t:'מיצגי בתי הספר',items:[
  {t:'דף מיצג לכל בית ספר',spec:'A4 · 13 בתי ספר · בליד 3 מ״מ',d:'שם בית הספר ושם היוזמה.',img:'dapei-mitzag.jpg',wide:true,files:[['13 דפי המיצג','dapei-mitzag.pdf']]},
  {t:'קאפות המיצגים',spec:'A3 · קאפה לכל מיצג · 15 מיצגים מאושרים',d:'שם בית הספר, שם היוזמה והיוזמה במשפט, השלט (הבעיה, מה עשינו, מה השתנה, טיפ), תמונה, וברקוד שבו המבקרים כותבים מילה טובה, דבר שהם לוקחים או שאלה למציגים.',img:'kapot-mitzagim.jpg',wide:true,
   note:'אורט אורמת עוד לא בקובץ. הקאפה שלה ממתינה לאישור.',
   files:[['15 קאפות המיצגים','kapot-mitzagim-a3-meusharot.pdf']]},
  {t:'מדריך המבקר · מוזיאון החדשנות',spec:'עלון בקיפול שער: דף 44.2×21 ס״מ דו־צדדי, מתקפל לגודל A5 · בליד 3 מ״מ · גרסה חלופית: דף A4 דו־צדדי',d:'העלון שמקבלים בכניסה למוזיאון. סגור: מימין ברוכים הבאים ואיך בוחרים מסלול, משמאל לוח הזמנים. בפנים: 16 המיצגים לפי חמשת האגפים. בגב: אמנת החינוך המקצועי היוצר.',img:'madrich.jpg',wide:true,files:[['עלון קיפול שער','madrich-a5.pdf'],['דף A4 דו־צדדי','madrich-a4.pdf']]}
 ]}
];

const isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(matchMedia('(pointer:coarse)').matches&&innerWidth<900);
const abs=f=>new URL('files/'+f,location.href).href;
/* 16.11.26 (מיטל): הקובץ יורד בשם עברי (כתובת הקובץ נשארת באנגלית כדי שהקישורים במייל לא יישברו) */
const heName=(it,n)=>((it.files.length>1?it.t+' - '+n:it.t).replace(/[·\/:*?"<>|]/g,' ').replace(/\s+/g,' ').trim()+'.pdf');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
          ml:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'};

function mailParts(it){
  const subject=`קובץ לדפוס: ${it.t} · כנס בתי הספר המקצועיים 23.11`;
  const lines=[`שלום,`,``,`מצורפים קישורים לקובץ הדפוס של ${it.t}.`,`גודל: ${it.spec}`,`הקבצים כוללים בליד וסימני חיתוך.`,``];
  it.files.forEach(([n,f])=>lines.push(`${n}: ${abs(f)}`));
  lines.push('',`תודה`);
  const text=lines.join('\n');
  const html=`<div dir="rtl" style="text-align:right;font-family:Arial,sans-serif;font-size:15px;line-height:1.6">
   <p>שלום,</p><p>מצורפים קישורים לקובץ הדפוס של <b>${esc(it.t)}</b>.<br>גודל: ${esc(it.spec)}<br>הקבצים כוללים בליד וסימני חיתוך.</p>
   <ul style="padding-right:20px;margin:0">${it.files.map(([n,f])=>`<li><a href="${abs(f)}">${esc(n)} (PDF)</a></li>`).join('')}</ul><p>תודה</p></div>`;
  return {subject,text,html};
}

const nav=document.getElementById('nav'),main=document.getElementById('main');let no=0;
GROUPS.forEach(g=>{
  nav.insertAdjacentHTML('beforeend',`<a href="#${g.id}">${g.t}</a>`);
  const sec=document.createElement('section');sec.className='grp';sec.id=g.id;
  sec.innerHTML=`<h2>${g.t}<small>${g.items.length===1?'פריט אחד':g.items.length+' פריטים'}</small></h2>`;
  g.items.forEach(it=>{
    no++;const m=mailParts(it);
    const mailto=`mailto:?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.text)}`;
    const multi=it.files.length>1;
    const filesHtml=multi?`<div class="files">${it.files.map(([n,f])=>`<div class="file"><a class="btn dl sm" href="files/${f}" download="${esc(heName(it,n))}">${IC.dl}${esc(n)}</a></div>`).join('')}</div>`:'';
    const el=document.createElement('article');el.className='item'+(it.wide?' wide':'');
    el.innerHTML=`<a class="thumb" href="img/${it.img}" data-lb><img src="img/${it.img}" alt="${esc(it.t)}" loading="lazy"></a>
     <div class="meta"><div class="no">${String(no).padStart(2,'0')}</div><h3>${esc(it.t)}</h3><div class="spec">${esc(it.spec)}</div><div class="stat" data-st="${it.img.replace(/\.\w+$/,'')}"></div><p class="desc">${esc(it.d)}</p>
     ${it.note?`<div class="note">${esc(it.note)}</div>`:''}
     ${filesHtml}
     <div class="btns">${multi?'':`<a class="btn dl" href="files/${it.files[0][1]}" download="${esc(heName(it,it.files[0][0]))}">${IC.dl}הורדת הקובץ</a>`}
      <a class="btn ml" href="${mailto}" data-mail="${no-1}">${IC.ml}${multi?'שליחת כל הקבצים במייל':'שליחה במייל'}</a></div></div>`;
    el._mail=m;sec.append(el);
  });
  main.append(sec);
});
const ITEMS=[...document.querySelectorAll('.item')];

const toast=(t,ms=4200)=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),ms);};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-mail]');
  if(a&&!isMobile){
    e.preventDefault();
    const m=ITEMS[+a.dataset.mail]._mail, clip=document.getElementById('clip');
    clip.innerHTML=m.html;const r=document.createRange();r.selectNodeContents(clip);const s=getSelection();s.removeAllRanges();s.addRange(r);
    let ok=false;try{ok=document.execCommand('copy');}catch(_){}
    s.removeAllRanges();
    const url='https://mail.google.com/mail/?view=cm&fs=1&su='+encodeURIComponent(m.subject)+(ok?'':'&body='+encodeURIComponent(m.text));
    window.open(url,'_blank');
    toast(ok?'נפתחה טיוטה ב-Gmail. לחצי בגוף המייל ו-Ctrl+V כדי להדביק את הנוסח והקישורים.':'נפתחה טיוטה ב-Gmail עם הנוסח והקישורים.',6000);
    return;
  }
  const t=e.target.closest('[data-lb]');
  if(t){e.preventDefault();const lb=document.getElementById('lb');lb.querySelector('img').src=t.getAttribute('href');lb.classList.add('on');}
});
document.getElementById('lb').addEventListener('click',e=>e.currentTarget.classList.remove('on'));

/* ── סטטוס הפריטים: נשמר בשרת (kenes-hachanot-gas), כולם רואים; מסמנים רק עם ?m= ── */
const ST_API='https://script.google.com/macros/s/AKfycbxxL9KPl1IjlAo5SM5CfKsF8m5A38BsKsV-_bMjKP9705BSD_O9WLlO_bIyxXhQSrx2AQ/exec';
const MK=new URLSearchParams(location.search).get('m')||'';
const ST={ready:['מוכן לשליחה','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'],
          fix:['עדיין צריך דיוק','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>']};
let stData={},stNotes={},stCan=false,stBusy=false,stEdit='';
const IC_NOTE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v12H10l-5 4z"/><path d="M9 9h6M9 12h4"/></svg>';
function stRender(){
  document.querySelectorAll('[data-st]').forEach(box=>{
    const id=box.dataset.st,cur=stData[id]||'',note=stNotes[id]||'',dis=stBusy?' disabled':'';
    let h=stCan
      ?Object.keys(ST).map(k=>`<button type="button" class="sb ${k}${cur===k?' on':''}" data-set="${k}" aria-pressed="${cur===k}"${dis}>${ST[k][1]}${ST[k][0]}</button>`).join('')
      :(ST[cur]?`<span class="sb ${cur} on">${ST[cur][1]}${ST[cur][0]}</span>`:'');
    if(stCan&&stEdit===id){
      h+=`<div class="sn-ed"><textarea rows="3" maxlength="1000" dir="rtl" placeholder="הערה לפריט הזה" aria-label="הערה">${esc(note)}</textarea>
        <div class="sn-act"><button type="button" class="btn dl sm" data-nsave${dis}>שמירת ההערה</button><button type="button" class="sb" data-ncancel${dis}>ביטול</button></div></div>`;
    }else{
      if(stCan)h+=`<button type="button" class="sb" data-nedit${dis}>${IC_NOTE}${note?'עריכת ההערה':'הוספת הערה'}</button>`;
      if(note)h+=`<div class="sn"><b>הערה:</b> ${esc(note).replace(/\n/g,'<br>')}</div>`;
    }
    box.innerHTML=h;
  });
}
function stLoad(){
  return fetch(ST_API+'?print=1&mk='+encodeURIComponent(MK),{credentials:'omit'}).then(r=>r.json()).then(j=>{
    if(j&&j.ok&&!stBusy&&!stEdit){stData=j.print||{};stNotes=j.notes||{};stCan=!!j.canMark;stRender();}
  }).catch(()=>{});
}
function stPost(body,okMsg,undo){
  stBusy=true;stRender();
  fetch(ST_API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:'print',mk:MK},body))})
   .then(r=>r.json()).then(j=>{if(!j||!j.ok)throw 0;stData=j.print||stData;stNotes=j.notes||stNotes;toast(okMsg,2200);})
   .catch(()=>{undo();toast('לא נשמר. נסי שוב.');})
   .finally(()=>{stBusy=false;stRender();});
}
document.addEventListener('click',e=>{
  const box=e.target.closest('[data-st]');if(!box||stBusy)return;
  const id=box.dataset.st,b=e.target.closest('button');if(!b)return;
  if(b.dataset.set){
    const prev=stData[id]||'',next=prev===b.dataset.set?'':b.dataset.set;
    stData[id]=next;stPost({id,status:next},next?'נשמר: '+ST[next][0]:'הסימון הוסר',()=>{stData[id]=prev;});
  }else if('nedit' in b.dataset){
    stEdit=id;stRender();const ta=box.querySelector('textarea');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
  }else if('ncancel' in b.dataset){
    stEdit='';stRender();
  }else if('nsave' in b.dataset){
    const prev=stNotes[id]||'',next=box.querySelector('textarea').value.trim();
    stNotes[id]=next;stEdit='';stPost({id,note:next},next?'ההערה נשמרה':'ההערה נמחקה',()=>{stNotes[id]=prev;stEdit=id;});
  }
});
stLoad();setInterval(()=>{if(!document.hidden)stLoad();},60000);
</script>
</body>
</html>

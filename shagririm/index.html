  פרטיות (סעיף 6 באפיון המקורי): בקובץ הזה אין שם, בית ספר, מייל או מפתח
  של אף אחד. הכול נשלף בזמן ריצה דרך SH_auth, שמחזיר רק את השורה של
  מחזיק/ת המפתח. שמות של משתתפים אחרים אינם מגיעים לדפדפן הזה.

  בלוק הנוכחות (#sh-attend) ו-SH_attend עברו לכאן כמו שהם, בלי שינוי.

-->

<header class="v2-top">
  <div class="v2-top-in">
    <button type="button" class="v2-burger" id="v2-burger" aria-label="פתיחת התפריט" aria-controls="v2-side" aria-expanded="false"><svg class="sh-ico"><use href="#i-menu"/></svg></button>
    <span class="v2-brand">
      <img src="assets/logo-kehila.png" alt="קהילת רכזי התקשוב" width="38" height="38">
      <span><b>שגרירי חדשנות טכנולוגית</b><small id="sh-track">סביבת הלמידה</small></span>
    </span>
    <!-- מתג העברית/ערבית (משימה 16) נכנס לכאן, בלי לגעת בשאר הדף -->
    <div id="sh-lang-slot"></div>
    <img class="v2-gov" src="assets/logo-minhal.png" alt="משרד העבודה · מינהל הכשרה מקצועית">
  </div>
</header>

<!-- מצב טעינה / שגיאה. shell.js מחליף את התוכן. -->
<div class="sh-pane sh-state" id="sh-boot">
  <div class="sh-mark" id="sh-boot-mark"></div>
  <h2 id="sh-boot-title">רגע, טוענים את הסביבה</h2>
  <p id="sh-boot-text">אם זה לוקח יותר מכמה שניות — כדאי לרענן את הדף.</p>
  <button class="sh-btn" id="sh-boot-retry" hidden>נסו שוב</button>
</div>

<div class="v2-wrap" id="v2-wrap" hidden>

  <!-- ================= תפריט הצד: שישה פריטים (הכרעה 13) ================= -->
  <aside class="v2-side" id="v2-side" aria-label="תפריט ראשי">
    <div class="v2-me">
      <div><b id="v2-me-name"></b><span id="v2-me-sub"></span><span class="v2-me-n" id="v2-me-n"></span></div>
      <svg id="v2-ring" viewBox="0 0 100 100" fill="none" stroke-width="9" stroke-linecap="round" aria-hidden="true"></svg>
    </div>
    <ul class="v2-nav" id="v2-nav">
      <li class="open" id="v2-nav-meet">
        <button type="button" data-nav="meet" aria-expanded="true"><svg class="sh-ico"><use href="#i-cal"/></svg>מפגשי הדרכה<svg class="sh-ico v2-caret"><use href="#i-caret"/></svg></button>
        <ul class="v2-mlist" id="v2-mlist"></ul>
      </li>
      <li><button type="button" data-nav="studio"><svg class="sh-ico"><use href="#i-studio"/></svg>הסטודיו שלי</button></li>
      <li><button type="button" data-nav="port"><svg class="sh-ico"><use href="#i-folio"/></svg>תיק העבודות שלי</button></li>
      <li><button type="button" data-nav="tools"><svg class="sh-ico"><use href="#i-tools"/></svg>מאגר הכלים</button></li>
      <li><button type="button" data-nav="att"><svg class="sh-ico"><use href="#i-clock"/></svg>נוכחות</button></li>
      <li><button type="button" data-nav="enrich"><svg class="sh-ico"><use href="#i-star"/></svg>הצעות להעשרה</button></li>
    </ul>
  </aside>

  <main class="v2-main" id="v2-main">

    <!-- ===== עמוד המפגש (מסך הבית = המפגש הנוכחי) ===== -->
    <section id="v2-session">
      <div class="v2-beats" id="v2-beats" hidden></div>
      <div class="v2-card v2-mhead" id="v2-mhead"></div>

      <div class="v2-big" id="v2-big">
        <div id="v2-item-page"></div>
        <div id="v2-item-slides"></div>
        <div class="v2-slides" id="v2-slides" hidden></div>
        <!-- ביום מפגש בלבד: בלוק הנוכחות, כמו שהוא. השרת מחליט שהיום יום מפגש. -->
        <section class="sh-live" id="sh-attend" hidden aria-labelledby="sh-attend-h"></section>
        <div id="v2-item-att"></div>
      </div>

      <div id="v2-below"></div>
    </section>

    <!-- ===== הדף המלווה. page.js בונה את התוכן. ===== -->
    <section id="v2-page" hidden></section>

    <!-- ===== חמשת המסכים האחרים. נפתחים לפי לוח הזמנים שבאפיון. ===== -->
    <section id="v2-other" hidden></section>

      שגרירי חדשנות טכנולוגית · משרד העבודה, מינהל הכשרה מקצועית<br>
      נבנה על ידי <a href="https://impact-os.app" target="_blank" rel="noopener">impactos · impact-os.app</a>
    </div>
  </main>
</div>

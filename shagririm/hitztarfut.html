<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>לא מופיע/ה ברשימה? · אדווה</title>
<!--
  אדווה · בקשת הצטרפות (3.10.26). קישור אחד כללי שמיטל שולחת בקבוצה.
  הבקשה נרשמת כ"ממתינה" בלשונית "בקשות הצטרפות". אף אחד לא נכנס לבד:
  רק אישור של מיטל (נתוני הבסיס באדווה) יוצר משתתף/ת עם קישור אישי.
  אין כאן שם, מייל או מפתח של אף אחד. השרת: Profile.source.txt (joinRequest).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/shell.css">
<style>
  body { background: var(--paper, #F9F8F6); }
  .jn { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  .jn-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .jn-top .b { display: flex; align-items: center; gap: 10px; }
  .jn-top .b b { font: 800 17px/1.1 Rubik, sans-serif; display: block; }
  .jn-top .b small { color: var(--muted); font-size: 12.5px; }
  .jn h1 { font: 800 26px/1.2 Rubik, sans-serif; margin: 0 0 8px; }
  .jn .lead { color: var(--muted); line-height: 1.65; margin: 0 0 18px; }
  .jn form { display: grid; gap: 14px; }
  .jn label { display: grid; gap: 6px; font-weight: 700; font-size: 14px; }
  .jn input, .jn select, .jn textarea { font: inherit; font-weight: 400; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .jn textarea { min-height: 70px; resize: vertical; }
  .jn .hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .jn { position: relative; }
  .jn .err { color: #A33; font-weight: 700; margin: 0; }
  .jn .done { text-align: center; padding: 28px 20px; }
  .jn .done h2 { margin: 0 0 8px; }
  .jn footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 28px; line-height: 1.7; }
  .jn footer a { color: var(--orange); }
</style>
</head>
<body>
<main class="jn">
  <div class="jn-top">
    <span class="b"><img src="assets/logo-kehila.png" alt="קהילת שגרירי החדשנות" width="40" height="40"><span><b>אדווה</b><small>שגרירי חדשנות טכנולוגית</small></span></span>
    <img src="assets/logo-minhal.png" alt="משרד העבודה · המנהל להכשרה מקצועית" height="34">
  </div>

  <div class="v2-card" id="jn-card">
    <h1>לא מופיע/ה ברשימה?</h1>
    <p class="lead">כל רכז/ת בהשתלמות קיבל/ה קישור אישי לאדווה. אם לא קיבלת, או שאת/ה מצטרף/ת עכשיו, ממלאים כאן ומיטל חוזרת אלייך עם קישור אישי.</p>
    <form id="jn-form" novalidate>
      <label>שם מלא<input id="jn-name" autocomplete="name" required></label>
      <label>בית ספר<select id="jn-school" required></select></label>
      <label>מייל<input id="jn-mail" type="email" dir="ltr" autocomplete="email" required></label>
      <label>מסלול
        <select id="jn-track">
          <option value="לא יודע/ת">לא יודע/ת</option>
          <option value="כלים">כלים · ימי שני</option>
          <option value="הובלה">הובלה · ימי רביעי</option>
        </select>
      </label>
      <label>הערה (לא חובה)<textarea id="jn-note" maxlength="400"></textarea></label>
      <label class="hp" aria-hidden="true">אל תמלאו<input id="jn-hp" tabindex="-1" autocomplete="off"></label>
      <p class="err" id="jn-err" role="alert" hidden></p>
      <button type="submit" class="v2-btn primary" id="jn-ok">שליחת הבקשה</button>
    </form>
  </div>

  <footer>
    שגרירי חדשנות טכנולוגית · משרד העבודה, המנהל להכשרה מקצועית<br>
    נבנה על ידי <a href="https://impact-os.app" target="_blank" rel="noopener">impactos · impact-os.app</a>
  </footer>
</main>

<script src="assets/schools64.js"></script>
<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbz1QHFO-kku43XIVJCuYLAvL3pARvdKeUYbIsBq-A8gKrVlsnAhGf0WUGIlAzeCgtBy/exec";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  $("jn-school").innerHTML = '<option value="">בחירת בית ספר…</option>' + (window.SH_SCHOOLS || []).map(function (n) { return "<option>" + esc(n) + "</option>"; }).join("");
  var ERR = { badname: "צריך שם מלא.", badschool: "צריך לבחור בית ספר.", badmail: "כתובת המייל לא נראית תקינה.", full: "יש כרגע יותר מדי בקשות. כדאי לכתוב למיטל ישירות.", busy: "המערכת עמוסה לרגע. כדאי לנסות שוב." };

  function post(body, tries) {
    tries = tries || 3;
    return fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); })
      .catch(function (e) { if (tries > 1) return new Promise(function (ok) { setTimeout(ok, 1200); }).then(function () { return post(body, tries - 1); }); throw e; });
  }

  $("jn-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var err = $("jn-err"), btn = $("jn-ok");
    var body = { action: "joinRequest", name: $("jn-name").value.trim(), school: $("jn-school").value, mail: $("jn-mail").value.trim(),
      track: $("jn-track").value, note: $("jn-note").value.trim(), hp: $("jn-hp").value };
    err.hidden = true;
    if (body.name.length < 2) { err.textContent = ERR.badname; err.hidden = false; return; }
    if (!body.school) { err.textContent = ERR.badschool; err.hidden = false; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(body.mail)) { err.textContent = ERR.badmail; err.hidden = false; return; }
    btn.disabled = true; btn.textContent = "שולחים…";
    post(body).then(function (r) {
      if (!r || r.ok !== true) throw r || {};
      $("jn-card").innerHTML = '<div class="done" role="status"><h2>' + (r.already ? "את/ה כבר ברשימה" : "הבקשה התקבלה") + "</h2><p class=\"lead\" style=\"margin:0\">" +
        (r.already ? "המייל הזה כבר רשום בהשתלמות. הקישור האישי לאדווה נשלח אלייך במייל. לא מוצא/ת? כדאי לכתוב למיטל." :
          "מיטל תאשר ותשלח אלייך קישור אישי לאדווה.") + "</p></div>";
    }).catch(function (r) {
      btn.disabled = false; btn.textContent = "שליחת הבקשה";
      err.textContent = ERR[r && r.error] || "השליחה לא הצליחה. כדאי לנסות שוב בעוד רגע.";
      err.hidden = false;
    });
  });
})();
</script>
</body>
</html>

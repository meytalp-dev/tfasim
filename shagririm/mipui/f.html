<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>שאלון · שגרירי חדשנות</title>
<!--
  שאלון שהרכז/ת בנה/תה ב"השאלונים שלי" (5.10.26).
  ?f=<מזהה השאלון>  ·  &test=1 (מילוי ניסיון של הרכז/ת, מסומן ולא נספר)
  השליחה יוצאת ברקע: המשיב/ה רואה "תודה" מיד, והתשובה נשמרת בתור מקומי עד שהשרת מאשר.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mipui.css">
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
</svg>

<div class="qwrap">
  <div class="qtop">
    <img src="../assets/logo-kehila.png" alt="שגרירי חדשנות טכנולוגית">
    <div class="sch"><b id="schName"></b><span id="schSub">שאלון</span></div>
  </div>
  <div id="app" style="flex:1;display:flex;flex-direction:column"><div class="loading">טוען את השאלון…</div></div>
</div>

<footer class="mf">
  <img src="../assets/logo-minhal.png" alt="משרד העבודה · המנהל להכשרה מקצועית">
  <div>שגרירי חדשנות טכנולוגית · המנהל להכשרה מקצועית · משרד העבודה</div>
  <div class="credit">נבנה על ידי <a href="https://impact-os.app" target="_blank" rel="noopener">impactos · impact-os.app</a></div>
</footer>

<script src="common.js"></script>
<script>
(function () {
  var P = new URLSearchParams(location.search);
  var F = (P.get('f') || '').replace(/[^a-z0-9]/gi, '');
  var TEST = P.get('test') === '1';
  var DONE_KEY = 'mipui_fdone_' + F;
  var QKEY = 'mipui_fqueue';
  var app = document.getElementById('app');
  var form = null, answers = {}, idx = -1, sent = false;

  function qs() {
    var list = form.qs.slice();
    if (form.named) list.unshift({ id: '__name', type: 'name', q: 'מה השם שלך?' });
    return list;
  }
  function req(q) { return q.req !== false && q.type !== 'text'; }

  function render() {
    if (!form) return;
    if (idx === -1) return renderStart();
    var list = qs();
    if (idx >= list.length) return renderDone();
    renderQ(list[idx], list);
  }

  function renderStart() {
    if (!TEST && mStore(DONE_KEY)) {
      app.innerHTML = '<div class="qstart" style="text-align:center"><div class="done-ic"><svg class="i"><use href="#i-check"/></svg></div>' +
        '<p>כבר מילאת את השאלון מהמכשיר הזה. תודה!</p><div><button class="btn sm" id="againB">מילוי נוסף (מכשיר משותף)</button></div></div>';
      document.getElementById('againB').onclick = function () { mStore(DONE_KEY, null); render(); };
      return;
    }
    var n = form.qs.length;
    app.innerHTML = '<div class="qstart"><h1>' + mEsc(form.title) + '</h1>' + (form.intro ? '<p>' + mEsc(form.intro) + '</p>' : '') +
      '<div class="meta"><span>' + n + ' שאלות</span></div>' +
      (TEST ? '<div class="testbar">מילוי ניסיון: התשובה מסומנת כבדיקה ולא נספרת.</div>' : '') +
      '<div><button class="btn pri" id="go" style="min-width:180px">מתחילים</button></div></div>';
    document.getElementById('go').onclick = function () { idx = 0; render(); };
  }

  function canNext(q) {
    var v = answers[q.id];
    if (q.type === 'name') return !!(v && v.trim().length >= 2);
    if (!req(q)) return true;
    if (q.type === 'many') return Array.isArray(v) && v.length > 0;
    return v != null && v !== '';
  }
  function go(d) { idx += d; if (idx < -1) idx = -1; render(); window.scrollTo(0, 0); }

  function renderQ(q, list) {
    var last = idx === list.length - 1;
    var h = '<div class="stories">' + list.map(function (_, i) { return '<i class="' + (i <= idx ? 'f' : '') + '"></i>'; }).join('') + '</div>' +
      '<div class="qcount">שאלה ' + (idx + 1) + ' מתוך ' + list.length + '</div>' +
      '<div class="qbody"><div class="qq" id="qh">' + mEsc(q.q) + '</div>';
    if (q.type === 'many') h += '<div class="qhint">עד ' + q.max + '</div>';
    else if (q.type === 'text') h += '<div class="qhint">לא חובה</div>';
    var v = answers[q.id];
    if (q.type === 'one' || q.type === 'many') {
      var multi = q.type === 'many', sel = multi ? (v || []) : v;
      h += '<div role="' + (multi ? 'group' : 'radiogroup') + '" aria-labelledby="qh" style="display:flex;flex-direction:column;gap:8px">';
      q.opts.forEach(function (o) {
        var on = multi ? sel.indexOf(o.id) > -1 : sel === o.id;
        var dim = multi && !on && sel.length >= q.max;
        h += '<button type="button" class="opt' + (multi ? ' multi' : '') + (on ? ' on' : '') + (dim ? ' dim' : '') + '" data-o="' + o.id + '" role="' + (multi ? 'checkbox' : 'radio') + '" aria-checked="' + on + '"><span class="mk"></span><span>' + mEsc(o.t) + '</span></button>';
      });
      h += '</div>';
    } else if (q.type === 'scale') {
      var ends = q.ends || ['בכלל לא', 'מאוד'];
      h += '<div class="scale" role="radiogroup" aria-labelledby="qh">' + [1, 2, 3, 4, 5].map(function (n) {
        return '<button type="button" data-n="' + n + '" class="' + (v === n ? 'on' : '') + '" role="radio" aria-checked="' + (v === n) + '">' + n + '</button>';
      }).join('') + '</div><div class="scale-ends"><span>1 · ' + mEsc(ends[0]) + '</span><span>5 · ' + mEsc(ends[1]) + '</span></div>';
    } else if (q.type === 'text') {
      h += '<textarea class="qt" id="tx" maxlength="1500" placeholder="כתבו כאן…" aria-labelledby="qh">' + mEsc(v || '') + '</textarea>';
    } else if (q.type === 'name') {
      h += '<input class="qt" id="tx" maxlength="80" autocomplete="name" placeholder="שם מלא" aria-labelledby="qh" value="' + mEsc(v || '') + '">';
    }
    h += '</div><div class="qnav"><button type="button" class="btn" id="bk"><svg class="i"><use href="#i-back"/></svg>חזרה</button>' +
      '<button type="button" class="btn pri" id="nx">' + (last ? 'שליחה' : (!req(q) && q.type !== 'name' && !answers[q.id] ? 'דילוג' : 'הבא')) + '</button></div>';
    app.innerHTML = h;

    var nx = document.getElementById('nx');
    nx.disabled = !canNext(q);
    document.getElementById('bk').onclick = function () { go(-1); };
    nx.onclick = function () { if (canNext(q)) go(1); };
    app.querySelectorAll('.opt').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-o');
        if (q.type === 'one') {
          answers[q.id] = id; render();
          setTimeout(function () { if (qs()[idx] && qs()[idx].id === q.id) go(1); }, 260);
        } else {
          var cur = (answers[q.id] || []).slice(), i = cur.indexOf(id);
          if (i > -1) cur.splice(i, 1); else if (cur.length < q.max) cur.push(id);
          answers[q.id] = cur; render();
        }
      };
    });
    app.querySelectorAll('.scale button').forEach(function (b) {
      b.onclick = function () {
        answers[q.id] = Number(b.getAttribute('data-n')); render();
        setTimeout(function () { if (qs()[idx] && qs()[idx].id === q.id) go(1); }, 260);
      };
    });
    var tx = document.getElementById('tx');
    if (tx) {
      tx.oninput = function () {
        answers[q.id] = tx.value;
        nx.disabled = !canNext(q);
        if (q.type === 'text' && !last) nx.textContent = tx.value.trim() ? 'הבא' : 'דילוג';
      };
      if (q.type === 'name') tx.focus();
    }
  }

  /* ---------- שליחה ברקע ---------- */
  function queue() { return mStore(QKEY) || []; }
  function flush() {
    var q = queue();
    if (!q.length) return;
    var item = q[0];
    mPost(item).then(function (r) {
      if (r && r.ok) { mStore(QKEY, queue().filter(function (x) { return x.rid !== item.rid; })); flush(); }
      else if (r && (r.error === 'form' || r.error === 'rid')) { mStore(QKEY, queue().filter(function (x) { return x.rid !== item.rid; })); flush(); }
      else setTimeout(flush, 4000);
    }).catch(function () { setTimeout(flush, 6000); });
  }

  function renderDone() {
    if (!sent) {
      var a = {};
      form.qs.forEach(function (q) {
        var v = answers[q.id];
        if (v == null || v === '' || (Array.isArray(v) && !v.length)) return;
        a[q.id] = typeof v === 'string' ? v.trim() : v;
      });
      var item = { action: 'fanswer', f: F, rid: mRid(), a: a };
      if (form.named) item.name = (answers.__name || '').trim();
      if (TEST) item.test = 1;
      mStore(QKEY, queue().concat([item]));
      if (!TEST) mStore(DONE_KEY, 1);
      sent = true;
      flush();
    }
    var first = (answers.__name || '').trim().split(/\s+/)[0];
    app.innerHTML = '<div class="qstart" style="text-align:center"><div class="done-ic"><svg class="i"><use href="#i-check"/></svg></div>' +
      '<h1>תודה' + (first ? ' ' + mEsc(first) : '') + '!</h1><p>התשובות נשלחו.</p>' +
      (TEST ? '<div class="testbar">מילוי ניסיון: התשובה מסומנת כבדיקה ולא נספרת.</div>' : '') + '</div>';
  }

  function bad(msg) { app.innerHTML = '<div class="qstart"><p class="err">' + msg + '</p></div>'; }
  if (!F) { bad('הקישור לא שלם. בקשו את הקישור המלא ממי ששלח/ה את השאלון.'); return; }
  var cached = mStore('mipui_form_' + F);
  function use(r) {
    form = r;
    // שאלונים של מיטל יושבים ב"בית ספר לדוגמה" (demo00); למשיבים מציגים את שם הקהילה
    document.getElementById('schName').textContent = r.school === 'בית ספר לדוגמה' ? 'קהילת שגרירי החדשנות' : (r.school || '');
    document.title = r.title;
    render();
  }
  if (cached) use(cached);
  function load(tries) {
    mGet({ action: 'form', f: F }, 20000).then(function (r) {
      if (r && r.error === 'action' && tries < 3) return setTimeout(function () { load(tries + 1); }, 1500);
      if (!r || !r.ok) { if (!cached) bad('השאלון לא נמצא. ייתכן שהוסר. בדקו את הקישור מול מי ששלח/ה אותו.'); return; }
      mStore('mipui_form_' + F, r);
      // לא מחליפים שאלות מתחת למשיב/ה באמצע מילוי
      if (!cached || idx === -1) use(r);
    }).catch(function () {
      // גוגל מחזיר לפעמים "הדף לא נמצא" רגעי: מנסים עוד כמה פעמים לפני שמציגים שגיאה
      if (tries < 4) return setTimeout(function () { load(tries + 1); }, 1500);
      if (!cached) bad('השרת לא ענה. רעננו את הדף בעוד רגע.');
    });
  }
  load(0);
  flush();
})();
</script>
</body>
</html>

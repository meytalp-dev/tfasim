i><li>ספרות: פודקאסט על היצירה. מעלים את היצירה ומפיקים סקירה קולית לפני הבגרות.</li><li>ספרות: ראיות לאופי. התלמידים בונים תיק ראיות לתכונה של דמות, מבקשים מהבינה ראיה נגדית ובודקים אם צריך לשנות את הטענה</li><li>ספרות: הקול שמספר. התלמידים משכתבים קטע קצר בגוף אחר, משווים לגרסת הבינה ומסבירים מה השתנה במידע ובקרבה לדמות</li><li>ספרות: מפת מתח. התלמידים מדרגים את המתח בחמש נקודות בסיפור, משווים לדירוג הבינה ומנמקים הבדלים באמצעות הטקסט</li><li>ספרות: משנים מילה, משנים אווירה. התלמידים מחליפים מילים בקטע קצר, משווים להצעות הבינה ומסבירים כיצד הבחירות משנות קצב, אווירה ומשמעות</li><li>לשון: משוב לפי מחוון. התלמידים כותבים פסקה, מקבלים משוב לפי המחוון של המורה, ומחליטים מה לתקן.</li><li>לשון: מצא את השגיאה. AI כותב טקסט עם שגיאות לשון, והתלמידים מוצאים ומסבירים.</li><li>לשון: משלבי לשון. AI כותב אותו מסר בשלושה משלבים, והתלמידים מזהים ומנמקים.</li><li>לשון: תרגול לבגרות. מפיקים בוחן מהחומר, עם הסבר לכל תשובה.</li><li>לשון: כותרת נאמנה. התלמידים מציעים כותרות לטקסט, משווים לכותרות הבינה ובוחרים כותרת שמייצגת את העיקר בלי להוסיף מידע</li><li>לשון: מי מסתתר מאחורי &quot;הוא&quot;?. התלמידים פותרים אזכורים בטקסט, משווים לפתרון הבינה ומשכתבים משפטים שאפשר להבין ביותר מדרך אחת</li><li>לשון: מקצרים בלי לאבד. התלמידים מצמצמים טקסט למחצית אורכו, משווים לקיצור של הבינה ובודקים אילו קשרים ומסרים חייבים להישאר</li><li>לשון: מילת קישור משנה טענה. התלמידים מחברים משפטים באמצעות מילות קישור שונות, בוחנים הסברי בינה ומנמקים כיצד הקשר הלוגי משתנה</li><li>אנגלית: שיחה קולית. שיחה קצרה עם AI לתרגול דיבור, ומשוב על שלוש טעויות חוזרות.</li><li>אנגלית: טקסט ברמה שלי. AI מתאים טקסט לשלוש רמות, וכל תלמיד קורא ברמה שלו.</li><li>אנגלית: ראיון עבודה במקצוע. AI משחק מראיין במקצוע של המגמה, באנגלית.</li><li>אנגלית: מילים מהטקסט. AI מכין רשימת מילים עם משפטי דוגמה מהטקסט שהכיתה קוראת.</li><li>אנגלית: הוראות שאפשר לבצע. התלמידים כותבים באנגלית הוראות לפעולה פשוטה במקצוע, בוחנים ניסוחים חלופיים של הבינה ומנסים את ההוראות בזוגות</li><li>אנגלית: תרגום בהקשר. התלמידים משווים שני תרגומים שהבינה מציעה למונח מקצועי, בודקים במשפטי מקור ובוחרים את המתאים</li><li>אנגלית: בקשה ברורה במייל. התלמידים כותבים באנגלית הודעה לספק דמיוני, בודקים בעזרת הבינה אם מטרת ההודעה ברורה ומשפרים פרטים חסרים</li><li>אנגלית: כשלא מבינים מילה. התלמידים מנסחים שאלות הבהרה באנגלית לביטויים מקצועיים, בודקים את תשובות הבינה ומסבירים את המושג מחדש במילים פשוטות</li><li>מתמטיקה: מצא את הטעות. AI פותר צעד אחר צעד עם טעות אחת, והתלמידים מוצאים ומסבירים.</li><li>מתמטיקה: שאלה מהמגמה. AI מנסח תרגיל מתוך המגמה של התלמידים (חשמל, רכב, קולינריה).</li><li>מתמטיקה: תרגול בשתי רמות. בוחן קצר בשתי רמות, וכל תלמיד מתחיל ברמה שלו.</li><li>מתמטיקה: גרף מנתונים. מעלים נתונים מהכיתה, ו-AI מצייר גרף. התלמידים מפרשים.</li><li>מתמטיקה: שתי דרכים, אותה תוצאה. התלמידים פותרים בעיה בדרך אחת, מבקשים מהבינה דרך אחרת ומשווים יעילות, בהירות והנחות</li><li>מתמטיקה: מה חסר בשאלה?. התלמידים בוחנים בעיה חסרת נתונים שהבינה מציעה, מזהים מה דרוש לפתרון וכותבים גרסה שאפשר לפתור</li><li>מתמטיקה: תמיד או לפעמים?. התלמידים בוחנים הכללה מתמטית שהבינה מנסחת, מחפשים דוגמה נגדית ומתקנים את הטענה</li><li>מתמטיקה: מעריכים לפני שמחשבים. התלמידים קובעים טווח סביר לתוצאה בבעיית כמויות או עלויות, משווים לחישוב הבינה ומסבירים אם התוצאה הגיונית</li><li>מדעים: ניסוי מדומה. בונים סימולציה של ניסוי ומשנים משתנה אחד בכל פעם.</li><li>מדעים: השערה ובדיקה. התלמידים כותבים השערה, ו-AI מציע דרך לבדוק אותה. הם משפרים.</li><li>מדעים: הסבר תופעה מהחיים. מצלמים תופעה ושואלים למה. בודקים מול החומר.</li><li>מדעים: כרטיסי מושגים. מעלים את החומר ומפיקים כרטיסי עזר.</li><li>מדעים: מודל עם גבולות. התלמידים בוחנים דימוי שהבינה מציעה לתופעה מדעית, מסמנים מה הוא מסביר ובונים דוגמה שבה הוא מטעה</li><li>מדעים: יש קשר, אבל למה?. התלמידים בוחנים שני משתנים שמשתנים יחד בטבלה דמיונית, משווים הסברים של הבינה ומציעים גורם נוסף שיכול להשפיע</li><li>מדעים: מודדים עם אי־ודאות. התלמידים משווים סדרות מדידה דמיוניות, בוחנים הסבר של הבינה לפיזור ומחליטים אילו מדידות כדאי לחזור ולבצע</li><li>מדעים: לאן עבר החומר?. התלמידים עוקבים אחר חומר בתיאור תהליך, בוחנים הסבר בינה ומתקנים את המודל כך שיתאים לעקרון שימור המסה</li><li>חינוך וכישורי חיים: ראיון עבודה. AI משחק מעסיק במקצוע של התלמיד, והתלמיד מתרגל.</li><li>חינוך וכישורי חיים: קורות חיים ראשונים. התלמידים כותבים קורות חיים עם AI, ובודקים שהכול נכון עליהם.</li><li>חינוך וכישורי חיים: דילמה כיתתית. AI מציג דילמה מחיי בית הספר, והכיתה מתדיינת.</li><li>חינוך וכישורי חיים: שימוש נכון ב-AI. הכיתה בונה יחד רמזור: מה מותר, מה בזהירות, מה אסור.</li><li>חינוך וכישורי חיים: שבוע שאפשר לעמוד בו. התלמידים מתכננים שבוע לדמות דמיונית עם לימודים ועבודה, בוחנים עומס שהבינה מזהה ומשאירים זמן למנוחה ולשינויים</li><li>חינוך וכישורי חיים: מבקשים עזרה בבירור. התלמידים מנסחים בקשת עזרה למצב לימודי דמיוני, משווים להצעת הבינה ומשלבים מה ניסו ובמה בדיוק נתקעו</li><li>חינוך וכישורי חיים: מה מסתתר במחיר?. התלמידים משווים הצעות רכישה דמיוניות עם תשלומים ועלויות נוספות, בודקים סיכום של הבינה ומנמקים בחירה</li><li>חינוך וכישורי חיים: מתוכנית לצעד ראשון. התלמידים מפרקים יעד של דמות דמיונית לצעדים קטנים, בוחנים הצעת בינה ובוחרים פעולה ראשונה ומדד להתקדמות</li></ul></noscript>

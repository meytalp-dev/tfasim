<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>מצלמים את הכנס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2f52;--navy2:#2b5a7a;--teal:#3a8f86;--teal2:#5fb3a6;--tealbg:#e6f2ef;--gold:#c8955a;--gold2:#e2b886;--goldbg:#f6ecdf;--paper:#fbfaf7;--card:#fff;--ink:#1d2b3a;--muted:#5a6b7c;--line:#e7dccb;--no:#a33a2a;
  --ease:cubic-bezier(.2,.75,.2,1);--sh:0 10px 24px -14px rgba(15,47,82,.35)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 17px/1.55 Heebo,Arial,sans-serif;min-height:100svh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 80% 40% at 50% 46%,rgba(226,184,134,.16),transparent 70%),
             radial-gradient(ellipse 70% 30% at 96% 2%,rgba(95,179,166,.16),transparent 70%),
             radial-gradient(ellipse 60% 30% at 0% 96%,rgba(226,184,134,.14),transparent 70%)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.hide{display:none!important}
[dir=ltr]{unicode-bidi:isolate}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.logo-band{background:#fff;padding:9px 16px 8px;text-align:center;position:relative}
.logo-band::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);opacity:.7}
.logo-band img{height:38px;max-width:100%;display:inline-block}
.art{display:block;position:relative;height:96px;overflow:hidden}
@media (min-width:600px){.art{max-width:560px;margin:0 auto;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wv path{animation:drift 11s ease-in-out infinite alternate}
.wv path:nth-child(2n){animation-duration:14s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-34px)}to{transform:translateX(34px)}}
.halo{animation:breathe 4.5s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.55}to{opacity:1}}
.needle{transform-box:fill-box;transform-origin:center;animation:settle 2.4s var(--ease) both}
@keyframes settle{0%{transform:rotate(-140deg);opacity:0}45%{transform:rotate(18deg);opacity:1}70%{transform:rotate(-7deg)}88%{transform:rotate(2deg)}}
.dial{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

main{width:100%;max-width:560px;margin:0 auto;padding:6px 16px 28px}
h1{font-size:25px;line-height:1.2;font-weight:900;color:var(--navy);margin:6px 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 16px;font-size:15.5px}

/* stations (crew) */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stn{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);cursor:pointer;text-align:right;position:relative}
.stn .n{font-size:13px;font-weight:800;color:var(--gold);min-width:20px}
.stn .l{flex:1;font-weight:700;color:var(--navy);line-height:1.25;font-size:15.5px}
.stn .c{font-size:12.5px;font-weight:800;color:var(--teal);background:var(--tealbg);border-radius:99px;padding:1px 8px;min-width:26px;text-align:center}
.stn .c:empty{display:none}
.stn:active{transform:scale(.98)}
.stn.on{border-color:var(--teal);outline:2px solid var(--teal);outline-offset:-1px}

/* task (participants) */
.task{background:var(--card);border:1px solid rgba(200,149,90,.55);border-radius:20px;box-shadow:var(--sh);padding:22px 18px 20px;text-align:center;position:relative}
.task .k{font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--gold);margin:0 0 6px}
.task h2{font-size:26px;line-height:1.25;font-weight:900;color:var(--navy);margin:0 0 18px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:16px;border:0;background:var(--navy);color:#fff;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 10px 20px -12px rgba(15,47,82,.7)}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy2);box-shadow:none;margin-top:10px;min-height:52px;font-size:16.5px}
.btn:active{transform:scale(.985)}
.others{margin-top:18px}
.others summary{cursor:pointer;color:var(--navy2);font-weight:700;font-size:15px;text-align:center;list-style:none}
.others summary::-webkit-details-marker{display:none}
.others ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.others li button{width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;color:var(--navy);cursor:pointer}
.others li button.on{border-color:var(--teal);background:var(--tealbg)}

/* upload list */
.ups{margin-top:18px;display:grid;gap:8px}
.up{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.up .th{width:46px;height:46px;border-radius:8px;background:var(--goldbg) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.up .m{flex:1;min-width:0}
.up .nm{font-size:13.5px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .bar{height:6px;border-radius:9px;background:#eef1f4;overflow:hidden;margin-top:5px}
.up .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal2));transition:width .3s}
.up .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.up.ok .s{color:var(--teal);font-weight:700}
.up.ok .bar i{background:var(--teal)}
.up.bad .s{color:var(--no);font-weight:700}
.up .rt{border:0;background:none;color:var(--no);cursor:pointer;padding:6px}
.sum{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--teal);font-weight:800;margin-top:14px;text-align:center}
.note{font-size:13.5px;color:var(--muted);text-align:center;margin:14px 0 0}
.err{background:#fff4f1;border:1px solid #efc9bf;color:var(--no);border-radius:14px;padding:14px;text-align:center;font-weight:600}

/* station sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(15,47,82,.38);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet.in{opacity:1}
.sheet .pane{position:relative;width:100%;max-width:560px;background:var(--paper);border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px;transform:translateY(30px);transition:transform .25s var(--ease)}
.sheet.in .pane{transform:none}
.sheet .k{margin:0;text-align:center;font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--gold)}
.sheet h3{margin:-4px 0 6px;text-align:center;font-size:23px;font-weight:900;color:var(--navy)}
.sheet .btn.alt{margin-top:0}
.sheet .x{position:absolute;top:10px;left:10px;border:0;background:none;color:var(--muted);padding:8px;cursor:pointer}
.sheet .hint{margin:2px 0 0;text-align:center;font-size:13.5px;color:var(--muted)}

/* thank-you */
.thx{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:16px;padding:14px;border-radius:16px;background:var(--tealbg);color:var(--teal);font-weight:800;text-align:center}
.thx svg{width:34px;height:34px}

/* conference foot (same as the print designs) */
.foot{margin-top:26px;text-align:center;color:var(--navy);font-weight:700;font-size:14px}
.foot .ln{display:flex;align-items:center;gap:10px;justify-content:center}
.foot .ln::before,.foot .ln::after{content:"";height:1px;flex:1;max-width:90px;background:linear-gradient(90deg,transparent,var(--gold))}
.foot .ln::after{background:linear-gradient(270deg,transparent,var(--gold))}
.foot small{display:block;color:var(--gold);font-weight:700;font-size:12.5px;margin-top:2px}
</style>
</head>
<body>
<div class="logo-band"><img src="logo-minhal.png" alt="המנהל להכשרה מקצועית · משרד העבודה"></div>
<div class="art" id="art"></div>
<main id="app"></main>
<input type="file" id="fGal" class="hide" multiple>
<input type="file" id="fCam" class="hide" accept="image/*">
<input type="file" id="fVid" class="hide" accept="video/*">
<div class="sheet hide" id="sheet" role="dialog" aria-modal="true">
  <div class="pane">
    <button class="x" id="shX" aria-label="סגירה"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <p class="k">תחנה</p><h3></h3>
    <button class="btn" id="shPhoto"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>תמונה עכשיו</button>
    <button class="btn" id="shVideo"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>סרטון עכשיו</button>
    <button class="btn alt" id="shGal"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>מהגלריה (כמה קבצים)</button>
    <p class="hint">רצפים וסרטונים ארוכים: לצלם במצלמה הרגילה ולהעלות מהגלריה בסוף התחנה.</p>
  </div>
</div>
<script>
"use strict";
var EXEC = "https://script.google.com/macros/s/AKfycby5WbU4bpkcZi_GB0wA6IYm_i7W5uja5PYt4hUsIegoMQU-eBN6E5QQIY2jX9xodBq5/exec";
var CREW = [["s01","אולם לפני"],["s02","כניסה ורישום"],["s03","צלם מגנטים"],["s04","ארוחת בוקר"],["s05","תערוכת רשתות"],["s06","נאומים וברכות"],["s07","עוז גוטרמן"],["s08","מוזיאון"],["s09","שולחנות עגולים"],["s10","במה ניהולית"],["s11","אולם אחרי"],["s12","ראיונות"]];
// משימות המשתתפים. cam: user = מצלמה קדמית (סלפי), environment = אחורית
// בלי משימות סלפי (p01, p03, p05): רויטל לא רוצה (20.11.26)
var TASKS = [
  ["p00","צלמו רגע של חיבור","כל היום","environment"],
  ["p02","צלמו מה אהבתם לאכול","ארוחת בוקר","environment"],
  ["p04","רגע אחד מהאולם: מישהו מקשיב, צוחק או רושם","נאומים והרצאה","environment"],
  ["p06","צלמו את השולחן שלכם","שולחנות עגולים","environment"],
  ["p07","רגע אחד מהאולם","במה ניהולית","environment"]
];
var Q = {}; location.search.slice(1).split("&").forEach(function (kv) { var p = kv.split("="); if (p[0]) Q[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || "").replace(/\+/g, " ")); });
var KEY = Q.k || "", WHO = (Q.c || "").slice(0, 30);
var MODE = "";            // crew | open
var CUR = "";             // current station / task id
var CH = 8 * 1024 * 1024; // chunk (multiple of 256KB)
var MAXPX = 2560;

var IC = {
  cam: '<svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>',
  img: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>',
  vid: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>',
  ok: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg>',
  re: '<svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>'
};
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function $(id) { return document.getElementById(id); }

/* ---------- conference art (same as the companion page) ---------- */
$("art").innerHTML = (function () {
  function waves(n, a0, da, k0, dk, y, from, to) { var out = ""; for (var i = 0; i < n; i++) { var a = a0 + i * da, k = k0 + i * dk, ph = i * .8, d = ""; for (var x = from; x <= to; x += 10) { var env = .18 + .82 * Math.min(1, Math.abs(x - 500) / 500); d += (x === from ? "M" : "L") + x + " " + (y + a * env * Math.sin(x * k + ph)).toFixed(1); } out += '<path d="' + d + '" fill="none" stroke="' + (i % 2 ? "#2b5a7a" : "#c8955a") + '" stroke-width="1.3" opacity=".55" vector-effect="non-scaling-stroke"/>'; } return out; }
  var s = '<svg viewBox="0 0 1000 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="kmHalo"><stop offset="0" stop-color="#e2b886" stop-opacity=".5"/><stop offset="1" stop-color="#e2b886" stop-opacity="0"/></radialGradient></defs><circle class="halo" cx="500" cy="120" r="130" fill="url(#kmHalo)"/><g class="wv">' + waves(9, 22, 7, .006, .0009, 120, -60, 1060) + "</g>";
  [[95,140,.8,"#c8955a"],[150,130,.95,"#c8955a"],[215,120,1.2,"#2b5a7a"],[285,132,.95,"#c8955a"],[335,142,.75,"#2b5a7a"]].forEach(function (p) { s += '<g transform="translate(' + p[0] + "," + p[1] + ") scale(" + p[2] + ')"><circle cx="0" cy="-30" r="15" fill="none" stroke="' + p[3] + '" stroke-width="2.4"/><path d="M-28 18 C-28 -6 28 -6 28 18" fill="none" stroke="' + p[3] + '" stroke-width="2.4" stroke-linecap="round"/></g>'; });
  var cols = ["#0f2f52","#2b5a7a","#5fb3a6","#c8955a","#9fb6c8"], seed = 7, rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }, ln = "", dt = "";
  for (var i = 0; i < 30; i++) { var x = 650 + rnd() * 330, y = 30 + rnd() * 190, r = 2.5 + rnd() * 5, c = cols[Math.floor(rnd() * cols.length)]; if (rnd() > .35) { var len = Math.min(30 + rnd() * 70, 985 - x); ln += '<path d="M' + x.toFixed(1) + " " + y.toFixed(1) + " L" + (x + len).toFixed(1) + " " + (y - len * .6 * (rnd() > .5 ? 1 : 0)).toFixed(1) + '" stroke="' + c + '" stroke-width="1" opacity=".45" fill="none"/>'; } dt += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + c + '" opacity=".9"/>'; }
  s += ln + "<g>" + dt + "</g>";
  s += '<g transform="translate(500 120)"><g class="dial"><circle r="52" fill="none" stroke="#c8955a" stroke-width="1" opacity=".5"/><circle r="70" fill="none" stroke="#c8955a" stroke-width=".8" stroke-dasharray="2 7" opacity=".55"/></g><line x1="0" y1="-140" x2="0" y2="140" stroke="#c8955a" stroke-width=".8" opacity=".45"/><line x1="-120" y1="0" x2="120" y2="0" stroke="#c8955a" stroke-width=".8" opacity=".45"/><g class="needle"><polygon points="0,-68 11,0 0,0" fill="#0f2f52"/><polygon points="0,-68 -11,0 0,0" fill="#2b5a7a"/><polygon points="0,68 -11,0 0,0" fill="#c8955a"/><polygon points="0,68 11,0 0,0" fill="#e2b886"/><polygon points="68,0 0,-11 0,0" fill="#2b5a7a"/><polygon points="68,0 0,11 0,0" fill="#0f2f52"/><polygon points="-68,0 0,11 0,0" fill="#2b5a7a"/><polygon points="-68,0 0,-11 0,0" fill="#0f2f52"/></g><circle r="4" fill="#fff" stroke="#0f2f52" stroke-width="1.5"/></g></svg>';
  return s;
})();

var FOOT = '<div class="foot"><div class="ln">כנס בתי הספר המקצועיים 2026</div><small>תשפ״ז</small></div>';

/* ---------- server ---------- */
function api(body) {
  return fetch(EXEC, { method: "POST", credentials: "omit", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); });
}
function apiGet(q) {
  return fetch(EXEC + "?" + q, { credentials: "omit", redirect: "follow" }).then(function (r) { return r.json(); });
}

/* ---------- screens ---------- */
function renderCrew() {
  var h = '<h1>מצלמים את הכנס</h1><p class="sub">בוחרים תחנה, ואז מצלמים ישר מכאן או מעלים מהגלריה.</p><div class="grid">';
  CREW.forEach(function (s, i) {
    h += '<button class="stn' + (CUR === s[0] ? " on" : "") + '" data-st="' + s[0] + '"><span class="n">' + String(i + 1).padStart(2, "0") + '</span><span class="l">' + esc(s[1]) + '</span><span class="c" id="c_' + s[0] + '"></span></button>';
  });
  h += '</div><div class="ups" id="ups"></div><div id="sum"></div>' +
    '<p class="note">אפשר לבחור כמה קבצים בבת אחת. תמונות מוקטנות לפני ההעלאה, סרטונים עולים כמו שהם. השאירו את הדף פתוח עד שהכול עולה.</p>' + FOOT;
  $("app").innerHTML = h;
  [].forEach.call(document.querySelectorAll(".stn"), function (b) {
    b.onclick = function () {
      CUR = b.getAttribute("data-st");
      [].forEach.call(document.querySelectorAll(".stn"), function (x) { x.classList.toggle("on", x === b); });
      openSheet();
    };
  });
  refreshCounts(); setInterval(refreshCounts, 30000);
}
// בחירה אחרי לחיצה על תחנה: תמונה עכשיו / סרטון עכשיו / מהגלריה
function openSheet() {
  var sh = $("sheet");
  sh.querySelector("h3").textContent = stName(CUR);
  sh.classList.remove("hide");
  requestAnimationFrame(function () { sh.classList.add("in"); });
}
function closeSheet() { var sh = $("sheet"); sh.classList.remove("in"); setTimeout(function () { sh.classList.add("hide"); }, 200); }
function pick(id, accept, capture) {
  var f = $(id); f.setAttribute("accept", accept);
  if (capture) f.setAttribute("capture", capture); else f.removeAttribute("capture");
  f.value = ""; closeSheet(); f.click();
}
$("shPhoto").onclick = function () { pick("fCam", "image/*", "environment"); };
$("shVideo").onclick = function () { pick("fVid", "video/*", "environment"); };
$("shGal").onclick = function () { pick("fGal", "image/*,video/*", ""); };
$("shX").onclick = closeSheet;
$("sheet").onclick = function (e) { if (e.target === this) closeSheet(); };
function refreshCounts() {
  apiGet("a=counts&k=" + encodeURIComponent(KEY)).then(function (j) {
    if (!j || !j.counts) return;
    CREW.forEach(function (s) { var el = $("c_" + s[0]); if (el) el.textContent = j.counts[s[0]] ? j.counts[s[0]] : ""; });
  }).catch(function () {});
}

function taskOf(id) { for (var i = 0; i < TASKS.length; i++) if (TASKS[i][0] === id) return TASKS[i]; return null; }
function renderTask() {
  var t = taskOf(CUR) || TASKS[0]; CUR = t[0];
  var h = '<div class="task"><p class="k">משימת צילום · ' + esc(t[2]) + '</p><h2>' + esc(t[1]) + '</h2>' +
    '<button class="btn" id="bCam">' + IC.cam + 'לצלם עכשיו</button>' +
    '<button class="btn alt" id="bGal">' + IC.img + 'לבחור מהגלריה</button>' +
    '<div id="thx"></div><div class="ups" id="ups"></div>' +
    '<details class="others"><summary>משימות צילום נוספות</summary><ul>';
  TASKS.forEach(function (x) { h += '<li><button data-t="' + x[0] + '"' + (x[0] === CUR ? ' class="on"' : "") + '>' + esc(x[1]) + ' <small style="color:var(--muted)">· ' + esc(x[2]) + '</small></button></li>'; });
  h += '</ul></details></div><p class="note">התמונות נכנסות לסרטון הסיכום ולאלבום הכנס, אחרי בדיקה של הצוות.</p>' + FOOT;
  $("app").innerHTML = h;
  $("bCam").onclick = function () { var f = $("fCam"); f.setAttribute("capture", t[3]); f.value = ""; f.click(); };
  $("bGal").onclick = function () { var f = $("fGal"); f.setAttribute("accept", "image/*"); f.value = ""; f.click(); };
  [].forEach.call(document.querySelectorAll(".others button"), function (b) { b.onclick = function () { CUR = b.getAttribute("data-t"); renderTask(); scrollTo(0, 0); }; });
}

/* ---------- files ---------- */
$("fGal").onchange = function () { take(this.files); };
$("fCam").onchange = function () { take(this.files); };
$("fVid").onchange = function () { take(this.files); };

function isVideo(f) { return /^video\//.test(f.type) || /\.(mov|mp4|m4v|3gp|webm|avi|mkv)$/i.test(f.name); }
function isImage(f) { return /^image\//.test(f.type) || /\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name); }
function mimeOf(f) {
  if (f.type) return f.type;
  var e = (f.name.split(".").pop() || "").toLowerCase();
  return { mov: "video/quicktime", mp4: "video/mp4", m4v: "video/mp4", "3gp": "video/3gpp", webm: "video/webm", heic: "image/heic", heif: "image/heif", jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp" }[e] || "application/octet-stream";
}

var QUEUE = [], ACTIVE = 0, DONE = 0, FAILED = 0, SEQ = 0;
function take(list) {
  var files = [].slice.call(list || []);
  files.forEach(function (f) {
    var v = isVideo(f);
    if (MODE === "open" && !isImage(f)) return;
    if (!v && !isImage(f)) return;
    var it = { id: ++SEQ, file: f, st: CUR, video: v, el: null, tries: 0 };
    it.el = document.createElement("div"); it.el.className = "up";
    it.el.innerHTML = '<div class="th">' + (v ? IC.vid : IC.img) + '</div><div class="m"><div class="nm"></div><div class="bar"><i></i></div><div class="s">ממתין…</div></div>';
    it.el.querySelector(".nm").textContent = (MODE === "crew" ? stName(CUR) + " · " : "") + f.name;
    $("ups").insertBefore(it.el, $("ups").firstChild);
    if (!v && window.URL && f.size < 30e6) { try { it.el.querySelector(".th").style.backgroundImage = "url(" + URL.createObjectURL(f) + ")"; it.el.querySelector(".th").innerHTML = ""; } catch (e) {} }
    QUEUE.push(it);
  });
  pump();
}
function stName(id) { for (var i = 0; i < CREW.length; i++) if (CREW[i][0] === id) return CREW[i][1]; return ""; }
function setS(it, txt, pct, cls) {
  it.el.querySelector(".s").textContent = txt;
  if (pct != null) it.el.querySelector(".bar i").style.width = Math.round(pct) + "%";
  it.el.className = "up" + (cls ? " " + cls : "");
}
function pump() {
  while (ACTIVE < 2 && QUEUE.length) { var it = QUEUE.shift(); ACTIVE++; run(it); }
  lock(ACTIVE > 0 || QUEUE.length > 0);
  summary();
}
function summary() {
  var el = $("sum");
  if (MODE !== "crew" || !el) return;
  el.innerHTML = (DONE || FAILED) ? '<div class="sum">' + IC.ok + "עלו " + DONE + " קבצים" + (FAILED ? " · " + FAILED + " נכשלו" : "") + (ACTIVE || QUEUE.length ? " · עוד " + (ACTIVE + QUEUE.length) + " בדרך" : "") + "</div>" : "";
}

function run(it) {
  setS(it, it.video ? "מכין…" : "מקטין…", 2);
  prepare(it).then(function (blob) {
    it.blob = blob;
    return api({ a: "start", k: KEY, st: it.st, type: blob.type || mimeOf(it.file), size: blob.size, name: blob.name || it.file.name, who: WHO, origin: location.origin });
  }).then(function (j) {
    if (!j || !j.ok) throw new Error((j && j.err) || "start");
    it.url = j.url;
    return send(it);
  }).then(function () {
    DONE++; setS(it, "עלה", 100, "ok");
    var s = it.el.querySelector(".s"); s.insertAdjacentHTML("afterbegin", IC.ok.replace('class="i"', 'class="i" style="width:15px;height:15px;vertical-align:-3px;margin-left:3px"'));
    if (MODE === "open") thanks();
    if (MODE === "crew") setTimeout(refreshCounts, 1500);
  }).catch(function (e) {
    FAILED++;
    var m = String(e && e.message || e);
    setS(it, m === "key" ? "הקישור לא תקין" : m === "size" ? "הקובץ גדול מדי" : m === "type" ? "רק תמונות" : "לא עלה. לנסות שוב", null, "bad");
    var b = document.createElement("button"); b.className = "rt"; b.innerHTML = IC.re; b.title = "לנסות שוב";
    b.onclick = function () { b.remove(); FAILED--; it.tries = 0; it.url = null; QUEUE.push(it); pump(); };
    it.el.appendChild(b);
  }).then(function () { ACTIVE--; pump(); });
}

// תמונה: הקטנה ל-2560 פיקסלים ו-JPEG. אם הדפדפן לא מצליח לפענח (HEIC וכד׳), עולה המקור.
function prepare(it) {
  var f = it.file;
  if (it.video || f.size < 900 * 1024 || !window.createImageBitmap) return Promise.resolve(wrap(f, f.name));
  return createImageBitmap(f, { imageOrientation: "from-image" }).then(function (bmp) {
    var w = bmp.width, h = bmp.height, sc = Math.min(1, MAXPX / Math.max(w, h));
    var c = document.createElement("canvas"); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    return new Promise(function (res) { c.toBlob(function (b) { res(b && b.size < f.size ? wrap(b, f.name.replace(/\.[^.]+$/, "") + ".jpg") : wrap(f, f.name)); }, "image/jpeg", .86); });
  }).catch(function () { return wrap(f, f.name); });
}
function wrap(b, name) {
  var type = b.type || mimeOf({ type: "", name: name });
  try { return new File([b], name, { type: type }); } catch (e) { var o = b.slice(0, b.size, type); o.name = name; return o; }
}

// העלאה בחלקים ישירות ל-Drive, עם המשך אחרי ניתוק
function send(it) {
  var size = it.blob.size, off = 0;
  function put(start) {
    var end = Math.min(start + CH, size);
    return new Promise(function (res, rej) {
      var x = new XMLHttpRequest();
      x.open("PUT", it.url);
      x.setRequestHeader("Content-Range", "bytes " + start + "-" + (end - 1) + "/" + size);
      x.upload.onprogress = function (e) { setS(it, pctTxt(start + e.loaded, size), 3 + 96 * (start + e.loaded) / size); };
      x.onload = function () { res({ status: x.status, range: x.status === 308 ? x.getResponseHeader("Range") : "" }); };
      x.onerror = function () { res({ status: 0 }); };
      x.ontimeout = function () { res({ status: 0 }); };
      x.timeout = 120000;
      x.send(it.blob.slice(start, end));
    });
  }
  function query() {
    return new Promise(function (res) {
      var x = new XMLHttpRequest(); x.open("PUT", it.url);
      x.setRequestHeader("Content-Range", "bytes */" + size);
      x.onload = function () { res({ status: x.status, range: x.getResponseHeader("Range") }); };
      x.onerror = function () { res({ status: 0 }); }; x.send();
    });
  }
  function next(r) {
    if (r.status === 200 || r.status === 201) return true;
    if (r.status === 308) { var m = /-(\d+)$/.exec(r.range || ""); off = m ? +m[1] + 1 : 0; it.tries = 0; return loop(); }
    if (r.status === 404 || r.status === 410) throw new Error("expired");
    it.tries++;
    if (it.tries > 8) throw new Error("net");
    setS(it, "החיבור נקטע, ממשיך…", null);
    return wait(Math.min(30000, 1500 * Math.pow(2, it.tries - 1))).then(query).then(next);
  }
  function loop() { return put(off).then(next); }
  return loop();
}
function pctTxt(done, size) { return size > 3e6 ? "עולה… " + Math.round(100 * done / size) + "% (" + (done / 1048576).toFixed(0) + " מתוך " + (size / 1048576).toFixed(0) + " MB)" : "עולה…"; }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function thanks() {
  var el = $("thx"); if (!el) return;
  el.innerHTML = '<div class="thx">' + IC.ok + '<span>תודה! התמונה עלתה</span><span style="font-weight:500;color:var(--ink);font-size:14.5px">אפשר לצלם עוד, או לחזור לדף המלווה</span></div>';
}

/* keep the phone awake and warn before leaving while uploading */
var WL = null, BUSY = false;
function lock(on) {
  BUSY = on;
  if (on && !WL && navigator.wakeLock) navigator.wakeLock.request("screen").then(function (l) { WL = l; l.addEventListener("release", function () { WL = null; }); }).catch(function () {});
  if (!on && WL) { WL.release().catch(function () {}); WL = null; }
}
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && BUSY) lock(true); });
addEventListener("beforeunload", function (e) { if (BUSY) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- start ---------- */
function bad(msg) { $("app").innerHTML = '<div class="err">' + esc(msg) + "</div>" + FOOT; }
if (!KEY) bad("הקישור חסר. פתחו את הדף מהקישור ששלחנו או מהדף המלווה.");
else apiGet("k=" + encodeURIComponent(KEY)).then(function (j) {
  if (!j || !j.ok) return bad("הקישור לא תקין. פתחו אותו שוב מהקישור ששלחנו.");
  MODE = j.role === "crew" ? "crew" : "open";
  if (MODE === "crew") renderCrew(); else { CUR = taskOf(Q.t) ? Q.t : "p00"; renderTask(); }
}).catch(function () { bad("אין חיבור לשרת כרגע. בדקו אינטרנט ונסו לרענן."); });
</script>

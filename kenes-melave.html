<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>הדף המלווה לכנס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F1E5;--card:#FFFDF8;--ink:#23302F;--soft:#5E6B69;--line:#E2D8C5;--teal:#0F6B68;--amber:#B9770E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:400 1.06rem/1.6 Heebo,Arial,sans-serif}
.logo-band{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;text-align:center}
.logo-band img{height:44px;max-width:100%}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:32px 24px;text-align:center}
.date{color:var(--amber);font-weight:500;margin:0 0 8px}
h1{font:700 2rem/1.25 "Frank Ruhl Libre",serif;margin:0 0 14px;color:var(--teal)}
p{margin:0}
.keep{margin-top:12px;color:var(--soft)}
footer{padding:16px;text-align:center;color:#8A97A6;font-size:.72rem;line-height:1.7}
footer a{color:inherit}
</style>
</head>
<body>
<div class="logo-band"><img src="chanichut/logo-minhal.png" alt="משרד העבודה · מינהל הכשרה מקצועית"></div>
<main>
  <div class="card">
    <p class="date">כנס מנהלים ורשתות · 23.11.26</p>
    <h1>הדף המלווה שלך ייפתח לקראת הכנס</h1>
    <p>הברקוד הזה הוא הברקוד האישי שלך.</p>
    <p class="keep">כדאי לשמור אותו. בכנס הוא יוביל לדף שילווה אותך לאורך היום.</p>
  </div>
</main>
<footer>המנהל להכשרה מקצועית · משרד העבודה<br>נבנה על ידי <a href="https://impactos.co.il/" target="_blank" rel="noopener">impactos · impactos.co.il</a></footer>
</body>
</html>

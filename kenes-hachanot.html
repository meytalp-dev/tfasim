<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>הכנות לכנס המנהלים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F1E5;--card:#FFFDF8;--ink:#23302F;--soft:#5E6B69;--line:#E2D8C5;--teal:#0F6B68;--teal-bg:#DCEEEB;--amber:#B9770E;--amber-bg:#FBEBCB;--danger:#A93226}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 Heebo,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.logo-band{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;text-align:center}
.logo-band img{height:44px;max-width:100%}
main{max-width:760px;margin:0 auto;padding:28px 16px 40px}
h1{font:700 2.1rem/1.2 "Frank Ruhl Libre",serif;margin:0}
.date{color:var(--amber);font-weight:500;margin:4px 0 20px}
.progress-label{font-weight:500;margin-bottom:6px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:26px}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.sec-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px;text-align:right;cursor:pointer;min-height:64px}
.sec-time{flex:0 0 96px;color:var(--amber);font-size:.86rem;font-weight:500;direction:ltr;text-align:right}
.sec-name{flex:1;font:700 1.15rem/1.3 "Frank Ruhl Libre",serif}
.sec-count{color:var(--soft);font-size:.86rem;white-space:nowrap}
.sec-head.complete .sec-count{color:var(--teal);font-weight:700}
.chev{width:18px;height:18px;flex:none;transition:transform .2s;stroke:var(--soft)}
.sec-head[aria-expanded=true] .chev{transform:rotate(180deg)}
.sec-body{border-top:1px solid var(--line);padding:4px 14px 14px}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:10px 0 0;border:2px solid var(--teal);border-radius:6px;background:#fff;cursor:pointer;position:relative}
.check:checked{background:var(--teal)}
.check:checked::after{content:"";position:absolute;right:6px;top:1px;width:6px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.check-wrap{flex:none;width:44px;min-height:44px;display:flex;justify-content:center;cursor:pointer}
.task-main{flex:1;min-width:0;padding-top:8px}
.task-text{overflow-wrap:anywhere}
.task.done .task-text{text-decoration:line-through;color:var(--soft)}
.owners{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.qo{min-height:44px;padding:0;background:none;border:0;cursor:pointer;display:inline-flex;align-items:center}
.qo span{border:1px solid var(--line);color:var(--soft);border-radius:20px;padding:3px 12px;font-size:.84rem}
.qo[aria-pressed=true] span{background:var(--amber-bg);border-color:var(--amber);color:#6F4706;font-weight:700}
.note{color:var(--soft);font-size:.9rem;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:8px;cursor:pointer}
.icon-btn:hover{background:var(--teal-bg)}
.icon-btn svg,.add svg{width:19px;height:19px;stroke:var(--teal);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty{color:var(--soft);padding:14px 0 6px}
.add{display:inline-flex;align-items:center;gap:7px;min-height:44px;margin-top:10px;padding:0 14px;background:none;border:1.5px dashed var(--teal);border-radius:8px;color:var(--teal);font-weight:500;cursor:pointer}
.editor{background:var(--teal-bg);border-radius:8px;padding:14px;margin:10px 0}
.editor label{display:block;font-size:.88rem;font-weight:500;margin:0 0 4px}
.editor textarea{display:block;width:100%;border:1px solid #AFCBC7;border-radius:6px;padding:9px;background:#fff;resize:vertical;margin-bottom:12px;font-size:16px}
.picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pick{min-height:44px;padding:0 16px;border:1.5px solid var(--teal);border-radius:22px;background:#fff;color:var(--teal);cursor:pointer}
.pick[aria-pressed=true]{background:var(--teal);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;padding:0 20px;border-radius:8px;border:1px solid var(--teal);background:#fff;color:var(--teal);font-weight:500;cursor:pointer}
.btn.primary{background:var(--teal);color:#fff}
.btn.del{margin-inline-start:auto;border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.6;cursor:default}
.status{padding:30px 0;text-align:center;color:var(--soft)}
.toast{position:fixed;bottom:18px;right:16px;left:16px;max-width:440px;margin:0 auto;background:var(--danger);color:#fff;padding:12px 16px;border-radius:8px;text-align:center}
footer{text-align:center;color:#8A97A6;font-size:.72rem;padding:0 16px 28px}
footer a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media(max-width:520px){h1{font-size:1.75rem}.sec-head{flex-wrap:wrap;gap:2px 10px}.sec-time{order:0;flex:1 1 100%}.sec-name{flex:1}}
</style>
</head>
<body>
<div class="logo-band"><img src="chanichut/logo-minhal.png" alt="משרד העבודה · מינהל הכשרה מקצועית"></div>
<main>
  <h1>הכנות לכנס המנהלים</h1>
  <div class="date">23.11.26</div>
  <div id="summary" hidden>
    <div class="progress-label" id="progress"></div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div id="app"><div class="status">טוען את המשימות…</div></div>
</main>
<footer>המנהל להכשרה מקצועית · משרד העבודה<br>נבנה על ידי <a href="https://impactos.co.il/" target="_blank" rel="noopener">impactos · impactos.co.il</a></footer>
<div class="toast" id="toast" role="alert" hidden></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbxxL9KPl1IjlAo5SM5CfKsF8m5A38BsKsV-_bMjKP9705BSD_O9WLlO_bIyxXhQSrx2AQ/exec';
var KEY = new URLSearchParams(location.search).get('k') || '';
var POLL_MS = 30000;
var OWNERS = ['מיטל', 'רויטל', 'עידית'];
var SECTIONS = [
  { id: 'gather', name: 'התכנסות ותערוכה', time: '9:00–9:30' },
  { id: 'speeches', name: 'נאומים', time: '9:30–10:30' },
  { id: 'lecture', name: 'הרצאה', time: '10:30–11:30' },
  { id: 'break', name: 'הפסקה ותערוכת בתי ספר', time: '11:30–12:00' },
  { id: 'tables', name: 'שולחנות עגולים', time: '12:00–13:00' },
  { id: 'lunch', name: 'ארוחת צהריים', time: '13:00–13:40' },
  { id: 'ted', name: 'טדים', time: '13:40–14:40' },
  { id: 'closing', name: 'סיכום', time: '14:40–15:00' }
];
var ICON = {
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
};

var tasks = [], openSection = null, draft = null, busy = false, writes = 0, loaded = false, toastTimer, ownerQueue = Promise.resolve();
var app = document.getElementById('app');

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, 5000);
}

function post(body) {
  body.k = KEY;
  return fetch(API, {
    method: 'POST',
    credentials: 'omit',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) throw new Error(d.error || 'failed');
    return d;
  });
}

function load() {
  var startedAt = writes;
  return fetch(API + '?k=' + encodeURIComponent(KEY), { credentials: 'omit' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) throw new Error(d.error || 'failed');
      if (startedAt !== writes) return;
      tasks = d.tasks;
      if (!loaded) {
        loaded = true;
        var first = SECTIONS.filter(function (s) { return inSection(s.id).some(function (t) { return !t.done; }); })[0];
        openSection = first ? first.id : SECTIONS[0].id;
      }
      render();
    })
    .catch(function () {
      if (!loaded) app.innerHTML = '<div class="status">לא הצלחנו לטעון את המשימות. בדקו את הקישור ונסו שוב.</div>';
    });
}

function inSection(id) {
  return tasks.filter(function (t) { return t.section === id; });
}

function editorHtml() {
  var isNew = !draft.existing;
  return '<div class="editor">' +
    '<label for="f-text">המשימה</label><textarea id="f-text" rows="2" maxlength="500">' + esc(draft.text) + '</textarea>' +
    '<label id="owners-label">אחראית</label><div class="picker" role="group" aria-labelledby="owners-label">' +
    OWNERS.map(function (o) {
      return '<button type="button" class="pick" data-act="owner" data-owner="' + esc(o) + '" aria-pressed="' + (draft.owners.indexOf(o) >= 0) + '">' + esc(o) + '</button>';
    }).join('') + '</div>' +
    '<label for="f-note">הערה</label><textarea id="f-note" rows="2" maxlength="1000">' + esc(draft.note) + '</textarea>' +
    '<div class="actions"><button type="button" class="btn primary" data-act="save"' + (busy ? ' disabled' : '') + '>' + (busy ? 'שומר…' : 'שמירה') + '</button>' +
    '<button type="button" class="btn" data-act="cancel"' + (busy ? ' disabled' : '') + '>ביטול</button>' +
    (isNew ? '' : '<button type="button" class="btn del" data-act="delete"' + (busy ? ' disabled' : '') + '>מחיקה</button>') +
    '</div></div>';
}

function taskHtml(t) {
  if (draft && draft.id === t.id) return editorHtml();
  return '<div class="task' + (t.done ? ' done' : '') + '">' +
    '<label class="check-wrap"><input class="check" type="checkbox" data-id="' + esc(t.id) + '"' + (t.done ? ' checked' : '') + ' aria-label="' + esc('הושלם: ' + t.text) + '"></label>' +
    '<div class="task-main"><div class="task-text">' + esc(t.text) + '</div>' +
    '<div class="owners" role="group" aria-label="אחראית">' + OWNERS.map(function (o) {
      return '<button type="button" class="qo" data-act="quick-owner" data-id="' + esc(t.id) + '" data-owner="' + esc(o) + '" aria-pressed="' + (t.owners.indexOf(o) >= 0) + '"><span>' + esc(o) + '</span></button>';
    }).join('') + '</div>' +
    (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '') +
    '</div><button type="button" class="icon-btn" data-act="edit" data-id="' + esc(t.id) + '" aria-label="' + esc('עריכה: ' + t.text) + '">' + ICON.edit + '</button></div>';
}

function render() {
  var done = tasks.filter(function (t) { return t.done; }).length;
  document.getElementById('summary').hidden = false;
  document.getElementById('progress').textContent = done + ' מתוך ' + tasks.length + ' משימות הושלמו';
  document.getElementById('bar').style.width = (tasks.length ? Math.round(done * 100 / tasks.length) : 0) + '%';

  app.innerHTML = SECTIONS.map(function (s) {
    var list = inSection(s.id);
    var d = list.filter(function (t) { return t.done; }).length;
    var open = openSection === s.id;
    var complete = list.length && d === list.length;
    var body = '';
    if (open) {
      var addingHere = draft && !draft.existing && draft.section === s.id;
      body = '<div class="sec-body">' +
        (list.length || addingHere ? list.map(taskHtml).join('') : '<div class="empty">אין עדיין משימות בחלק הזה.</div>') +
        (addingHere ? editorHtml() : '<button type="button" class="add" data-act="add" data-section="' + s.id + '">' + ICON.plus + 'הוספת משימה</button>') +
        '</div>';
    }
    return '<section class="section"><button type="button" class="sec-head' + (complete ? ' complete' : '') + '" data-act="section" data-section="' + s.id + '" aria-expanded="' + open + '">' +
      '<span class="sec-time">' + s.time + '</span><span class="sec-name">' + esc(s.name) + '</span>' +
      '<span class="sec-count">' + d + ' מתוך ' + list.length + '</span>' + ICON.chev + '</button>' + body + '</section>';
  }).join('');
}

function startEdit(next) {
  draft = next;
  render();
  var f = document.getElementById('f-text');
  if (f) f.focus();
}

function toggle(id, checked) {
  var t = tasks.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  t.done = checked;
  writes++;
  render();
  post({ action: 'toggle', id: id, done: checked }).catch(function () {
    t.done = !checked;
    writes++;
    render();
    toast('הסימון לא נשמר. נסו שוב.');
  });
}

function quickOwner(id, owner) {
  var t = tasks.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  var before = t.owners.slice();
  var i = t.owners.indexOf(owner);
  if (i >= 0) t.owners.splice(i, 1); else t.owners.push(owner);
  var owners = t.owners.slice();
  writes++;
  render();
  ownerQueue = ownerQueue.then(function () {
    return post({ action: 'save', id: t.id, section: t.section, text: t.text, owners: owners, note: t.note });
  }).then(function () {
    writes++;
  }).catch(function () {
    t.owners = before;
    writes++;
    render();
    toast('הסימון לא נשמר. נסו שוב.');
  });
}

function save() {
  if (busy) return;
  var text = draft.text.trim();
  if (!text) { toast('צריך לכתוב את המשימה.'); return; }
  busy = true;
  writes++;
  render();
  var saved = { id: draft.id, section: draft.section, text: text, owners: draft.owners.slice(), note: draft.note.trim() };
  post({ action: 'save', id: saved.id, section: saved.section, text: saved.text, owners: saved.owners, note: saved.note }).then(function () {
    var cur = tasks.filter(function (x) { return x.id === saved.id; })[0];
    if (cur) { cur.text = saved.text; cur.owners = saved.owners; cur.note = saved.note; }
    else { saved.done = false; tasks.push(saved); }
    busy = false;
    draft = null;
    writes++;
    render();
  }).catch(function () {
    busy = false;
    render();
    toast('השמירה נכשלה. הטקסט נשאר כאן, נסו שוב.');
  });
}

function removeTask() {
  if (busy || !confirm('למחוק את המשימה?')) return;
  var id = draft.id;
  busy = true;
  writes++;
  render();
  post({ action: 'delete', id: id }).then(function () {
    tasks = tasks.filter(function (x) { return x.id !== id; });
    busy = false;
    draft = null;
    writes++;
    render();
  }).catch(function () {
    busy = false;
    render();
    toast('המחיקה נכשלה. נסו שוב.');
  });
}

app.addEventListener('input', function (e) {
  if (!draft) return;
  if (e.target.id === 'f-text') draft.text = e.target.value;
  if (e.target.id === 'f-note') draft.note = e.target.value;
});

app.addEventListener('change', function (e) {
  if (e.target.classList.contains('check')) toggle(e.target.getAttribute('data-id'), e.target.checked);
});

app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.getAttribute('data-act');
  if (act === 'section') {
    var sid = b.getAttribute('data-section');
    openSection = openSection === sid ? null : sid;
    if (!busy) draft = null;
    render();
  } else if (act === 'edit') {
    if (busy) return;
    var t = tasks.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0];
    if (t) startEdit({ existing: true, id: t.id, section: t.section, text: t.text, owners: t.owners.slice(), note: t.note });
  } else if (act === 'add') {
    if (busy) return;
    startEdit({ existing: false, id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), section: b.getAttribute('data-section'), text: '', owners: [], note: '' });
  } else if (act === 'quick-owner') {
    quickOwner(b.getAttribute('data-id'), b.getAttribute('data-owner'));
  } else if (act === 'owner') {
    var o = b.getAttribute('data-owner'), i = draft.owners.indexOf(o);
    if (i >= 0) draft.owners.splice(i, 1); else draft.owners.push(o);
    b.setAttribute('aria-pressed', i < 0);
  } else if (act === 'cancel') {
    draft = null;
    render();
  } else if (act === 'save') {
    save();
  } else if (act === 'delete') {
    removeTask();
  }
});

load();
setInterval(function () {
  if (loaded && !draft && !document.hidden) load();
}, POLL_MS);
document.addEventListener('visibilitychange', function () {
  if (loaded && !draft && !document.hidden) load();
});
</script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מצגת מלווה · כנס מנהלים ורשתות</title>
<style>
/* מצגת מלווה לכנס · במה 1920×1080 שמתכווננת לכל מסך · עובדת בלי אינטרנט (הגופן מוטמע בסוף הקובץ) */
:root{--navy:#0f2f52;--navy2:#2b5a7a;--teal:#3a8f86;--teal2:#5fb3a6;--gold:#c8955a;--gold2:#e2b886;--paper:#fbfaf7;--ink:#1d2b3a;--muted:#5a6b7c;
  --ease:cubic-bezier(.65,0,.35,1)}
@property --ma{syntax:'<length>';inherits:false;initial-value:0px}
@property --mb{syntax:'<length>';inherits:false;initial-value:1920px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);overflow:hidden}
body{font-family:'Heebo',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
body.nocur,body.nocur *{cursor:none}
bdi{unicode-bidi:isolate}

#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;overflow:hidden;transform-origin:50% 50%;
  background:radial-gradient(ellipse 42% 46% at 94% 2%,rgba(95,179,166,.17),transparent 70%),
             radial-gradient(ellipse 46% 50% at 3% 99%,rgba(226,184,134,.22),transparent 70%),
             radial-gradient(ellipse 60% 60% at 50% 58%,rgba(226,184,134,.12),transparent 72%),var(--paper)}

/* האיור — שכבה אחת שנעה בין השקפים */
#ill{position:absolute;inset:0;pointer-events:none;transition:--ma 1.5s var(--ease),--mb 1.5s var(--ease),opacity 1.2s ease;
  -webkit-mask-image:linear-gradient(to right,transparent var(--ma),#000 calc(var(--ma) + 180px),#000 calc(var(--mb) - 180px),transparent var(--mb));
          mask-image:linear-gradient(to right,transparent var(--ma),#000 calc(var(--ma) + 180px),#000 calc(var(--mb) - 180px),transparent var(--mb))}
#art{position:absolute;left:0;top:0;width:1000px;height:490px;overflow:visible;transform-origin:0 0;transition:transform 1.6s var(--ease)}
#art .halo{transform-box:fill-box;transform-origin:center;animation:pulse 5.5s ease-in-out infinite;animation-delay:var(--d)}
#art .ln{animation:breathe 7s ease-in-out infinite;animation-delay:var(--d)}
#art .spin{transform-box:view-box;transform-origin:500px 245px;animation:spin 160s linear infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.15}50%{transform:scale(1.9);opacity:.04}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.12}}
@keyframes spin{to{transform:rotate(360deg)}}

#logo{position:absolute;left:0;top:0;width:520px;transform-origin:0 0;mix-blend-mode:multiply;transition:transform 1.4s var(--ease);z-index:3;pointer-events:none}

/* קו ההתקדמות של היום */
#prog{position:absolute;left:400px;right:60px;top:30px;height:16px;z-index:3;transition:opacity .8s;pointer-events:none}
#prog .tr{position:absolute;left:0;right:0;top:7px;height:2px;background:rgba(226,184,134,.5)}
#prog .fl{position:absolute;right:0;top:6px;height:4px;border-radius:2px;background:linear-gradient(to left,var(--gold2),var(--gold));transition:width 1.4s var(--ease)}
#prog .tk{position:absolute;top:3px;width:10px;height:10px;margin-right:-5px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px var(--gold2)}
#prog .tk.done{background:var(--gold);box-shadow:0 0 0 2px var(--gold)}
#prog .hd{position:absolute;top:0;width:16px;height:16px;margin-right:-8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(200,149,90,.2);transition:right 1.4s var(--ease)}

#hint{position:absolute;left:0;right:0;top:60px;text-align:center;font-size:26px;font-weight:500;color:var(--muted);letter-spacing:.04em;z-index:4;opacity:0;transition:opacity 1.2s;pointer-events:none}
#hint.show{opacity:.9}

/* שקפים */
#slides{position:absolute;inset:0;z-index:2}
.slide{position:absolute;inset:0;visibility:hidden;opacity:0;transition:opacity .6s ease,visibility 0s linear .6s}
.slide.on{visibility:visible;opacity:1;transition:opacity .6s ease .1s,visibility 0s}
.slide.on .in{animation:rise 1.05s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(.35s + var(--i)*.11s)}
.slide.on .draw{animation:draw 1.3s cubic-bezier(.7,0,.2,1) both;animation-delay:calc(.55s + var(--i)*.11s)}
@keyframes rise{from{opacity:0;transform:translateY(36px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}

em{font-style:normal}
.chip{display:inline-flex;align-items:center;gap:18px;padding:8px 30px 10px;border-radius:999px;background:rgba(255,255,255,.65);box-shadow:inset 0 0 0 2px rgba(200,149,90,.55);font-size:36px;font-weight:600;color:var(--navy2);white-space:nowrap}
.chip svg{width:34px;height:34px;flex:0 0 auto}
.lbl{display:flex;align-items:center;justify-content:center;gap:26px;font-size:42px;font-weight:700;color:var(--gold);letter-spacing:.08em}
.lbl::before,.lbl::after{content:"";width:80px;height:3px;background:var(--gold2)}
.rule{display:block;width:260px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2))}
.clock .c{animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}

/* 1 · ברוכים הבאים */
.w-right{position:absolute;right:80px;width:840px;top:196px;display:flex;flex-direction:column;align-items:center;text-align:center}
.w-right .rule{width:120px;height:4px}
.w-kenes{margin-top:24px;font-size:56px;font-weight:700;color:var(--navy);line-height:1.16}
.w-year{display:flex;align-items:center;gap:26px;margin-top:12px;font-size:36px;font-weight:500;color:var(--navy);letter-spacing:.3em}
.w-year i{display:block;width:150px;height:2px;background:var(--gold2)}
.w-h1{margin-top:16px;font-weight:900;color:var(--navy);line-height:.9;letter-spacing:-.015em;font-size:215px}
.w-h1 span{display:block}
.w-h1 .b{color:var(--teal)}
.w-lead{margin-top:28px;font-size:46px;font-weight:700;color:var(--navy2);line-height:1.2}
.w-lead em{color:var(--navy);font-weight:900}
.w-left{position:absolute;left:60px;width:880px;top:64px;display:flex;flex-direction:column;align-items:center;text-align:center}
.w-date{font-size:36px;font-weight:500;color:var(--teal)}
.w-date span{color:var(--gold);margin:0 10px}
.w-clock{margin-top:6px;font-size:96px;font-weight:300;color:var(--navy);line-height:1.05;font-variant-numeric:tabular-nums}
.w-start{font-size:38px;font-weight:600;color:var(--gold)}
.theme .t1{font-size:72px;font-weight:900;color:var(--navy);line-height:1.08;letter-spacing:-.01em}
.theme .t1 em{color:var(--teal)}
.theme .t2{margin-top:6px;font-size:48px;font-weight:500;color:var(--navy);line-height:1.2}
.w-theme{position:absolute;left:60px;width:880px;top:770px;text-align:center}
.tag{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:34px}
.tag i{display:block;width:110px;height:3px;background:var(--gold)}
.tag p{font-size:40px;font-weight:500;color:var(--navy);letter-spacing:.01em}
.tag p em{color:var(--teal)}
.t-welcome .tag{top:985px}

/* 2 · לוח הזמנים */
.s-head{position:absolute;right:70px;width:560px;top:150px;text-align:center}
.s-head h2{font-size:168px;font-weight:900;color:var(--navy);line-height:.94;letter-spacing:-.015em}
.s-head h2 span{display:block}
.s-head h2 .b{color:var(--teal)}
.s-head .d{margin-top:28px;font-size:38px;font-weight:500;color:var(--teal);line-height:1.35}
.s-head .d span{color:var(--gold)}
.luz{position:absolute;left:80px;width:1150px;top:135px;list-style:none}
.luz::before{content:"";position:absolute;right:303px;top:46px;bottom:46px;width:3px;background:linear-gradient(var(--gold2),var(--gold) 50%,var(--gold2))}
.luz li{position:relative;display:grid;grid-template-columns:270px 70px 1fr;align-items:center;padding:15px 0;min-height:96px;text-align:right}
.luz li::after{content:"";position:absolute;right:295px;top:50%;width:19px;height:19px;margin-top:-9.5px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 3px var(--gold)}
.luz li.k::after{background:var(--teal);box-shadow:0 0 0 3px var(--teal),0 0 0 9px rgba(58,143,134,.16)}
.luz time{grid-column:1;font-size:44px;font-weight:800;color:var(--teal);direction:ltr;text-align:left;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.luz .t{grid-column:3;font-size:46px;font-weight:700;color:var(--navy);line-height:1.15}
.luz .t small{display:inline-block;margin-left:18px;font-size:36px;font-weight:600;color:var(--gold);letter-spacing:.04em}
.luz .s{display:block;margin-top:4px;font-size:35px;font-weight:400;color:var(--ink);line-height:1.25}
.luz li.soft .t{font-weight:400;color:var(--navy2)}
.luz li.soft time{color:var(--navy2);font-weight:500}

/* שקפי כותרת / דוברים / הרצאה */
.cen{position:absolute;left:120px;right:120px;top:90px;height:640px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cen .big{font-weight:900;color:var(--navy);line-height:1.02;letter-spacing:-.015em;white-space:nowrap}
.cen .rule{margin-top:34px}
.cen .role{margin-top:30px;font-size:60px;font-weight:500;color:var(--navy2);line-height:1.2}
.cen .sub{margin-top:30px;font-size:58px;font-weight:500;color:var(--teal);line-height:1.2}
.cen .talk{margin-top:30px;font-size:66px;font-weight:700;color:var(--navy2);line-height:1.2}
.cen .chip{margin-bottom:34px}
.cen .lbl{margin-bottom:26px}
.cen .after{margin-top:40px;margin-bottom:0}
.t-section .big{font-size:230px}
.t-section.long .big{font-size:180px}
.t-speaker .big{font-size:172px}
.t-speaker .big.two{font-size:128px;line-height:1.08}
.t-lecture .big{font-size:156px}
.t-title .big{font-size:160px}
.t-title .pname{margin-top:36px;font-size:76px;font-weight:800;color:var(--navy)}
.t-title .pname+.role{margin-top:8px}

/* שקפי המתנה */
.t-hold .cen{height:600px;top:70px}
.t-hold .big{font-size:210px}
.t-hold .back{margin-top:26px;font-size:72px;font-weight:700;color:var(--teal)}
.t-hold .note{margin-top:14px;font-size:64px;font-weight:700;color:var(--navy);line-height:1.2}
.t-hold .cd{margin-top:8px;font-size:40px;font-weight:500;color:var(--muted);min-height:48px}
.t-hold .hclock{position:absolute;left:0;right:0;top:925px;text-align:center;font-size:84px;font-weight:300;color:var(--navy2);line-height:1;font-variant-numeric:tabular-nums}

/* שקפי סדנה */
.wrap{position:absolute;left:140px;right:140px;top:96px;bottom:126px;display:flex;flex-direction:column;text-align:right}
.wrap .chip{align-self:flex-start;margin-bottom:22px}
.wrap h2{font-size:96px;font-weight:900;color:var(--navy);line-height:1.05;letter-spacing:-.01em}
.wrap h2 small{font-size:54px;font-weight:500;color:var(--teal);letter-spacing:0;margin-right:22px}
.wrap .sub{margin-top:10px;font-size:54px;font-weight:500;color:var(--teal);line-height:1.2}
.wrap .txt{margin-top:18px;font-size:42px;font-weight:400;color:var(--ink);line-height:1.3}
.qbox{position:relative;flex:1;margin-top:56px;display:flex;align-items:center;justify-content:center;padding:60px 130px;border-radius:34px;
  background:rgba(255,255,255,.86);box-shadow:inset 0 0 0 2px rgba(200,149,90,.42),0 30px 60px -40px rgba(15,47,82,.35)}
.qbox p{font-size:62px;font-weight:500;color:var(--navy);line-height:1.42;text-align:center;text-wrap:balance}
.qbox.short{flex:0 0 auto;min-height:400px;margin-top:auto;margin-bottom:auto}
.qbox.short p{font-size:88px;font-weight:700}
.qbox .mk{position:absolute;right:56px;top:40px;width:96px;height:72px;color:var(--gold);opacity:.85}
.bgnum{position:absolute;left:30px;top:130px;font-size:440px;font-weight:300;line-height:.8;color:transparent;-webkit-text-stroke:3px rgba(200,149,90,.34);direction:ltr;letter-spacing:-.03em;pointer-events:none}
.cards{flex:1;margin-top:40px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:28px}
.card{position:relative;display:flex;flex-direction:column;padding:26px 38px 30px;border-radius:26px;background:rgba(255,255,255,.8);
  box-shadow:inset 0 0 0 2px rgba(58,143,134,.22),0 24px 44px -34px rgba(15,47,82,.4)}
.card::before{content:"";position:absolute;right:38px;left:38px;top:0;height:5px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.card b{font-size:54px;font-weight:800;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.card p{margin-top:8px;font-size:42px;font-weight:600;color:var(--navy);line-height:1.26}
.moves{margin-top:auto;display:flex;align-items:stretch;gap:0}
.move{flex:1;display:flex;align-items:center;gap:24px;padding:28px 34px;border-radius:26px;background:rgba(255,255,255,.78);box-shadow:inset 0 0 0 2px rgba(58,143,134,.3)}
.move .n{flex:0 0 auto;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#fff;background:var(--teal)}
.move p{font-size:44px;font-weight:600;color:var(--navy);line-height:1.22}
.arrow{flex:0 0 96px;display:flex;align-items:center;justify-content:center}
.arrow svg{width:70px;height:36px}
.bar{margin-top:auto;display:flex;gap:8px}
.seg{display:flex;flex-direction:column}
.seg .b{height:66px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#fff;white-space:nowrap;transform-origin:right center}
.seg:first-child .b{border-radius:0 16px 16px 0}
.seg:last-child .b{border-radius:16px 0 0 16px}
.seg .l{margin-top:16px;padding:0 6px;font-size:35px;line-height:1.22;color:var(--ink);text-align:center}
.seg .l b{display:block;font-weight:700;color:var(--navy)}
.slide.on .seg .b{animation:draw 1s cubic-bezier(.7,0,.2,1) both;animation-delay:calc(.9s + var(--k)*.22s)}

/* סיום */
.cl{position:absolute;left:100px;right:100px;top:190px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cl .rule{width:120px;height:4px}
.cl h2{margin-top:26px;font-size:150px;font-weight:900;color:var(--navy);line-height:1;letter-spacing:-.015em;white-space:nowrap}
.cl h2 em{color:var(--teal)}
.t-closing .theme{position:absolute;left:0;right:0;top:712px;text-align:center}
.t-closing .theme .t1{font-size:78px}
.t-closing .tag{top:925px}
.credit{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:22px;color:var(--muted);letter-spacing:.06em;opacity:.75}

@media (prefers-reduced-motion:reduce){
  .slide.on .in,.slide.on .draw,.slide.on .seg .b{animation:none}
  .slide,.slide.on{transition:opacity .3s}
  #art,#logo,#ill,#prog .fl,#prog .hd{transition:none}
  #art .halo,#art .ln,#art .spin,.clock .c{animation:none}
}
</style>
</head>
<body>
<div id="stage">
  <div id="ill"><svg id="art" viewBox="0 0 1000 490" aria-hidden="true"></svg></div>
  <img id="logo" src="logo.png" alt="משרד העבודה · המנהל להכשרה מקצועית">
  <div id="prog"><div class="tr"></div><div class="fl"></div><div class="hd"></div></div>
  <div id="slides"></div>
  <div id="hint">F למסך מלא · חצים למעבר · P נעימה · M השתקה</div>
</div>

<script>
/* ==================================================================
   תוכן המצגת — כל שינוי של שם, תפקיד או שעה נעשה כאן, בשורה אחת.
   השעות נכתבות רק ב-agenda; השקפים מפנים לשורה שלהם דרך at.
   שדה ריק ('') פשוט לא מוצג.
   ================================================================== */
const DECK = {
  kenes: 'כנס מנהלים ורשתות לבתי הספר המקצועיים',
  year:  'תשפ״ז',
  day:   'יום שני, י״ג בכסלו',
  date:  '23/11/26',

  // לוח הזמנים — משמש את שקף הלו"ז, את "חוזרים ב־" ואת קו ההתקדמות
  agenda: [
    { id:'gather',   from:'9:00',  to:'9:30',  title:'התכנסות', soft:true },
    { id:'greet',    from:'9:30',  to:'10:30', title:'ברכות ודברי פתיחה' },
    { id:'lecture',  from:'10:30', to:'11:30', label:'הרצאה', title:'פרופ׳ עוז גוטרמן', sub:'"מפתחות ההצלחה בעידן טכנולוגי סוער"' },
    { id:'break',    from:'11:30', to:'11:45', title:'הפסקה', soft:true },
    { id:'workshop', from:'11:45', to:'13:00', title:'סדנה בשולחנות עגולים' },
    { id:'lunch',    from:'13:00', to:'13:40', title:'ארוחת צהריים', soft:true },
    { id:'stage',    from:'13:40', to:'14:40', title:'במה ניהולית', sub:'מנהלים משתפים, מעוררים השראה ומובילים שינוי' },
    { id:'summary',  from:'14:40', to:'15:00', title:'סיכום היום' },
  ],

  // השקפים, לפי הסדר
  slides: [
    { type:'welcome',  at:'gather' },
    { type:'schedule', at:'gather' },
    { type:'section',  at:'greet', title:'ברכות' },
    { type:'speaker',  at:'greet', label:'ברכות', name:'אמיר מדינה',        role:'ראש המנהל להכשרה מקצועית' },
    { type:'speaker',  at:'greet', label:'ברכות', name:'אורית וקנין־שילה', role:'ממונת נוער, המנהל להכשרה מקצועית' },
    { type:'speaker',  at:'greet', label:'ברכות', name:'רויטל אמיר',        role:'המפקחת הפדגוגית הארצית' },
    { type:'title',    at:'greet', title:'הצגת ספר ההפעלה', name:'רויטל אמיר', role:'המפקחת הפדגוגית הארצית' },   // שם ותפקיד המציג/ה (אפשר להשאיר '')
    { type:'lecture',  at:'lecture' },   // שם המרצה ושם ההרצאה נלקחים משורת 'lecture' בלו"ז (title / sub)
    { type:'hold',     at:'break', title:'הפסקה', note:'אתם מוזמנים לבקר במוזיאון החדשנות' },                              // "חוזרים ב־" = שעת הסיום של ההפסקה
    { type:'section',  at:'workshop', title:'סדנה בשולחנות עגולים', sub:'מנהיגות אנושית בעידן הבינה המלאכותית' },
    { type:'hold',     at:'lunch', label:'בתיאבון', title:'ארוחת צהריים' },
    // דוברי הבמה הניהולית: כל שורה { name:'…', role:'…' } יוצרת שקף דובר מיד אחרי השקף הזה, לפי הסדר.
    // שני דוברים בשקף אחד: names:['שם ראשון','ושם שני'] — כל שם בשורה משלו.
    { type:'section',  at:'stage', title:'במה ניהולית', sub:'מנהלים משתפים, מעוררים השראה ומובילים שינוי', speakers:[
      { name:'ד״ר ורד אזולאי', role:'מנהלת עתיד פלמחים' },
      { name:'נורה מחאגנה',  role:'מנהלת אום אל פחם בנות' },
      { names:['עבד אבו אלקיעאן','ואופיר אלמלח כרמל'], role:'מנהלי דרור נווה מדבר' },
      { name:'הרב שלמה אזרף', role:'מנהל ישיבת חנוך לנער' },
      // { name:'שם הדובר/ת', role:'תפקיד ובית ספר' },
    ] },
    { type:'section',  at:'summary', title:'סיכום היום' },
    { type:'closing' },
  ],
};
</script>
<script>
(function(){
'use strict';

/* ===== מוזיקת מעבר בין חלקי היום =====
   מתנגנת כשמתקדמים לחלק חדש בלו"ז, וגם בין דובר לדובר בברכות (לא כשחוזרים אחורה).
   נוצרת בדפדפן עצמו, בלי קובץ ובלי רשת. M = השתקה/הפעלה. volume = עוצמה (0–1). */
const MUSIC={on:true,volume:.5};
let AC=null,bus=null,cut=null,pend=false;
/* נעימת הפתיחה בשקף ברוכים הבאים: הדפדפן מרשה צליל רק אחרי לחיצה, ולכן היא מתנגנת בלחיצה על F (מסך מלא) או על P */
function welcomeMusic(){if(!MUSIC.on||!SL[cur]||SL[cur].type!=='welcome')return;const ac=audio();if(!ac)return;if(ac.state==='running')sting();else pend=true;}
function audio(){if(AC)return AC;const X=window.AudioContext||window.webkitAudioContext;if(!X)return null;
  AC=new X();bus=AC.createGain();bus.gain.value=MUSIC.volume;
  const cmp=AC.createDynamicsCompressor();bus.connect(cmp);cmp.connect(AC.destination);
  /* הד רך */
  const dl=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter();dl.delayTime.value=.33;fb.gain.value=.34;lp.type='lowpass';lp.frequency.value=2200;
  bus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(cmp);
  return AC;}
function hush(){if(!AC||!bus)return;const t=AC.currentTime;bus.gain.cancelScheduledValues(t);bus.gain.setTargetAtTime(0,t,.08);}
function bell(f,t,len,vol){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain();
  o.type='sine';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.22;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+len);
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(cut);o.start(t);o2.start(t);o.stop(t+len+.05);o2.stop(t+len+.05);}
/* צליל דמוי פסנתר רך */
function key(f,t,len,vol){const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(6000,f*6),t);lp.frequency.exponentialRampToValueAtTime(Math.max(500,f*2),t+len);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(vol*.35,t+.35);g.gain.exponentialRampToValueAtTime(.0001,t+len);
  [[1,1,'triangle'],[2,.3,'sine'],[3,.1,'sine']].forEach(([m,a,w])=>{const o=AC.createOscillator(),og=AC.createGain();o.type=w;o.frequency.value=f*m;og.gain.value=a;o.connect(og);og.connect(lp);o.start(t);o.stop(t+len+.05);});
  lp.connect(g);g.connect(cut);}
/* מצע חם ושקט מתחת למנגינה */
function warm(f,t,len,vol){const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type='triangle';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=700;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.8);g.gain.setValueAtTime(vol,t+Math.max(.9,len-.6));g.gain.linearRampToValueAtTime(0,t+len+.4);

/* נעימה רכה, כ־14 שניות: מנגינה בפסנתר מעל ליווי מתגלגל (רה מז'ור: I–vi–IV–V–I) */
function sting(){if(!MUSIC.on)return;const ac=audio();if(!ac)return;
  try{if(ac.state==='suspended')ac.resume();}catch(e){}
  const t=ac.currentTime+.05;bus.gain.cancelScheduledValues(t);bus.gain.setValueAtTime(MUSIC.volume,t);
  /* נעימה חדשה משתיקה את הקודמת, כדי שלא יתנגנו שתיים יחד */
  if(cut){const old=cut;old.gain.setTargetAtTime(0,t,.06);setTimeout(()=>{try{old.disconnect();}catch(e){}},1500);}
  cut=AC.createGain();cut.connect(bus);
  const B=.6,bar=4*B;
  const G2=98,A2=110,B2=123.47,D3=146.83,E3=164.81,Fs3=185,G3=196,A3=220,B3=246.94,Cs4=277.18,D4=293.66,Fs4=369.99,A4=440,Fs5=739.99,G5=783.99,A5=880,B5=987.77,Cs6=1108.73,D6=1174.66;
  /* ליווי: שמיניות מתגלגלות */
  [[D3,A3,Fs4,A3,D4,A3,Fs4,A3],[B2,Fs3,D4,Fs3,B3,Fs3,D4,Fs3],[G2,D3,B3,D3,G3,D3,B3,D3],[A2,E3,Cs4,E3,A3,E3,Cs4,E3]]
    .forEach((ch,b)=>{ch.forEach((f,i)=>key(f,t+b*bar+i*B/2,1.5,i?.07:.1));warm(ch[0],t+b*bar,bar,.035);warm(ch[2],t+b*bar,bar,.02);});
  /* מנגינה: [תו, פעמה בתיבה, אורך בפעמות] */
  [[[Fs5,0,1.5],[A5,1.5,.5],[D6,2,1],[A5,3,1]],
   [[B5,0,1.5],[A5,1.5,.5],[Fs5,2,2]],
   [[G5,0,1],[B5,1,1],[D6,2,1],[B5,3,1]],
   [[A5,0,1],[B5,1,1],[Cs6,2,2]]]
    .forEach((m,b)=>m.forEach(([f,a,l])=>key(f,t+b*bar+a*B,l*B+1.1,.16)));
  /* אקורד סיום מתגלגל ומתפוגג */
  const e=t+4*bar;[D3,A3,D4,Fs4,A4].forEach((f,i)=>key(f,e+i*.07,4,.09));key(D6,e+.1,4.2,.17);key(A5,e+.1,4,.07);warm(D3,e,3.6,.04);warm(A3,e,3.6,.025);}
function flash(txt){const h=document.getElementById('hint');h.textContent=txt;h.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>h.classList.remove('show'),1800);}
function toggleFs(){try{if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});}
  else{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{});}}catch(e){}}
let tx=0,ty=0,lastSwipe=0;
addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){lastSwipe=Date.now();dx>0?next():prev();}},{passive:true});
addEventListener('click',e=>{if(e.button!==0||Date.now()-lastSwipe<700)return;next();});
addEventListener('hashchange',()=>{const n=fromHash();if(n!==cur)go(n);});

/* התאמת הבמה לחלון */
const stage=document.getElementById('stage');
function scale(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${k})`;}
addEventListener('resize',scale);scale();

/* סמן העכבר נעלם אחרי רגע */
let curT;addEventListener('mousemove',()=>{document.body.classList.remove('nocur');clearTimeout(curT);curT=setTimeout(()=>document.body.classList.add('nocur'),2500);});

/* שעון חי + "בעוד X דק׳" */
function tick(){const d=new Date(),h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');
  const html=`${h}<span class="c">:</span>${m}`;
  document.querySelectorAll('.slide.on .clock').forEach(c=>{if(c.dataset.v!==html){c.innerHTML=html;c.dataset.v=html;}});
  const now=h*60+d.getMinutes();
  document.querySelectorAll('.slide.on .cd').forEach(c=>{const left=toMin(c.dataset.to)-now;
    c.textContent=(left>1&&left<=60)?`בעוד ${left} דק׳`:(left===1?'בעוד דקה':'');});}
setInterval(tick,1000);

/* רמז קצר בטעינה הראשונה */
function hint(){let seen=false;try{seen=sessionStorage.getItem('deckHint')==='1';sessionStorage.setItem('deckHint','1');}catch(e){}
  if(seen)return;const h=document.getElementById('hint');h.classList.add('show');setTimeout(()=>h.classList.remove('show'),4500);}

/* פתיחה: מחכים לגופן ואז מציגים */
function start(){fitAll();go(fromHash(),1);hint();welcomeMusic();}
const ready=()=>Promise.all(['400 40px Heebo','700 40px Heebo','900 40px Heebo','300 40px Heebo'].map(f=>document.fonts.load(f,'אב 09'))).catch(()=>{});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>ready().then(start));else ready().then(start);
})();
